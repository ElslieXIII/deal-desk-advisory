/* ---------------- Email scan (simulated) ---------------- */
/* People can be named by id, or by organisation + position (so sample proposals survive a re-seed) */
function propPerson(P, idKey, orgPrefix){
  const id = P[idKey]; if (id && rec('people', id)) return rec('people', id);
  const k = n => orgPrefix ? orgPrefix + n : n.charAt(0).toLowerCase() + n.slice(1);
  const fid = P[k('FirmId')], cid = P[k('CompanyId')], pick = P[k('Pick')] || 0;
  if (fid) return peopleAt('firm', fid)[pick] || null;
  if (cid) return peopleAt('company', cid)[pick] || null;
  return null;
}
const propFrom = p => propPerson(p, 'fromId', 'from');
function crmTarget(P){
  if (P.targetKind === 'person') return {coll: 'people', r: propPerson(P, 'id', '')};
  const coll = P.targetKind === 'company' ? 'companies' : 'firms';
  return {coll, r: rec(coll, P.id)};
}
function crmNewValue(P, r){
  if (P.mode === 'add') return uniq([...arr(r[P.field]), ...arr(P.value)]).sort((a, b) => P.field === 'tickets' ? TICKETS.indexOf(a) - TICKETS.indexOf(b) : 0);
  return P.value;
}
function proposalChange(p){
  const P = p.payload || {};
  switch (p.type) {
    case 'newcontact': {
      const dup = all('people').find(x => P.email && x.email.toLowerCase() === String(P.email).toLowerCase());
      const org = P.newOrg ? null : rec(P.orgKind === 'company' ? 'companies' : 'firms', P.orgId);
      const orgTxt = P.newOrg ? `<b>${esc(P.newOrg.name)}</b> <span class="pill a">New institution</span> ${esc(P.newOrg.type)} · ${esc([P.newOrg.city, P.newOrg.hq].filter(Boolean).join(', '))}${arr(P.newOrg.tickets).length ? ' · ' + esc(ticketText(P.newOrg.tickets)) : ''}${arr(P.newOrg.sectors).length ? ' · ' + esc(arr(P.newOrg.sectors).join(', ')) : ''}` : org ? link(P.orgKind === 'company' ? 'company' : 'firm', org.id, org.name, '') : '?';
      return dup ? `Already in the CRM: ${link('person', dup.id, dup.name, '')} (${esc(dup.email)})` : `Add to CRM: <b>${esc(P.name)}</b>${P.title ? ', ' + esc(P.title) : ''} at ${orgTxt}<div class="mono" style="font-size:11.5px;margin-top:2px">${esc(P.email || '')}${P.phone ? ' · ' + esc(P.phone) : ''}</div>`;
    }
    case 'crmupdate': {
      const {coll, r} = crmTarget(P); if (!r) return 'Record not found';
      const nv = crmNewValue(P, r);
      const who = coll === 'people' ? `${link('person', r.id, r.name, '')} <span class="sub2">(${esc(orgName(r))})</span>` : link(coll === 'firms' ? 'firm' : 'company', r.id, r.name, '');
      return same(r[P.field], nv) ? `${who}: ${esc(FIELD_NAMES[P.field] || P.field)} is already up to date` : `${who}: ${esc(FIELD_NAMES[P.field] || P.field)} <del>${fmtVal(P.field, r[P.field])}</del> → <b>${fmtVal(P.field, nv)}</b>`;
    }
    case 'followup': return `New task: <b>${esc(P.text || 'Follow up with ' + p.fromName)}</b>${P.due ? ` · due <span class="mono">${fmtDate(P.due)}</span>` : ''}`;
    case 'opportunity': return `New opportunity: <b>${esc(nameOf('company', P.companyId) || nameOf('firm', P.firmId) || '?')}</b>${P.mandate ? ' · ' + esc(P.mandate) : ''} — ${esc(P.text || '')}`;
    case 'dist': { const r = rec('dist', P.distId); return r ? `${esc(recLabel('dist', r))}: status <del>${esc(r.status)}</del> → <b>${esc(P.status)}</b>` : 'Distribution row not found'; }
    case 'lastcomms': { const pp = rec('people', P.personId); return pp ? `${esc(pp.name)}: last contacted <del>${fmtDate(pp.lastContact) || 'never'}</del> → <b>${fmtDate(P.date)}</b>` : 'Contact not found'; }
    case 'nextstep': { const d = rec('deals', P.dealId); return d ? `${esc(dealName(d))}: next step <del>${esc(d.nextStep || '—')}</del> → <b>${esc(P.text)}</b>${P.due ? ` · due <span class="mono">${fmtDate(P.due)}</span>` : ''}` : 'Deal not found'; }
  }
  return '';
}
function proposalCan(p, type){
  const P = p.payload || {};
  if (type === 'newcontact') return !!(P.name && P.email && (P.newOrg || rec(P.orgKind === 'company' ? 'companies' : 'firms', P.orgId)) && !all('people').some(x => x.email.toLowerCase() === String(P.email).toLowerCase()));
  if (type === 'crmupdate') { const {r} = crmTarget(P); return !!(r && P.field && !same(r[P.field], crmNewValue(P, r))); }
  if (p.type === 'newcontact' || p.type === 'crmupdate') { if (type === 'followup' || type === 'lastcomms') return !!propFrom(p) || type === 'followup'; return false; }
  if (type === 'dist') return !!rec('dist', P.distId);
  if (type === 'lastcomms') return !!rec('people', P.personId || p.fromId);
  if (type === 'nextstep') return !!rec('deals', P.dealId);
  if (type === 'opportunity') return !!(P.companyId || (rec('people', P.personId || p.fromId)?.orgType === 'company'));
  return true;
}
function approveWrites(p){
  const P = p.payload || {}; const writes = [];
  const pr = Object.assign(clone(p), {state: 'approved', decidedBy: me(), decidedAt: today()});
  if (p.type === 'followup') writes.push({coll:'tasks', id: uid('t'), rec: {kind:'task', title: P.text || 'Follow up with ' + p.fromName, owners: [p.owner], importance: 'Medium', category: P.dealId ? 'Live mandate – task' : 'Business development', due: P.due || addDays(today(), 3), created: today(), done: false, link: P.dealId ? {kind:'deal', id: P.dealId} : P.personId || p.fromId ? {kind:'person', id: P.personId || p.fromId} : null, source: 'Email scan', proposalId: p.id}});
  if (p.type === 'opportunity') { const cid = P.companyId || rec('people', P.personId || p.fromId)?.orgId; const id = uid('o'); writes.push({coll:'opps', id, rec: {kind:'company', companyId: cid, sponsorId: P.firmId && INVESTOR_TYPES.includes(rec('firms', P.firmId)?.type) ? P.firmId : null, signal: 'Network intel', mandate: P.mandate || 'Sell-side', relevance: 'Medium', status: 'New', rms: [p.owner], details: P.text || p.summary, nextStep: '', nextDue: null, identified: today(), lastUpdate: today(), source: 'Email scan', sectors: arr(rec('companies', cid)?.sectors)}}); }
  if (p.type === 'dist') { const r = rec('dist', P.distId); const nr = Object.assign(clone(r), {status: P.status, lastUpdate: today(), dataRoom: P.status === 'In data room' ? 'Granted' : r.dataRoom}); if (!r.lastContacted || r.lastContacted < p.date) nr.lastContacted = p.date; writes.push({coll:'dist', id: r.id, rec: nr}); }
  if (p.type === 'lastcomms') { const pp = rec('people', P.personId || p.fromId); const date = P.date || p.date; if (!pp.lastContact || pp.lastContact < date) writes.push({coll:'people', id: pp.id, rec: Object.assign(clone(pp), {lastContact: date})}); }
  if (p.type === 'nextstep') { const d = rec('deals', P.dealId); writes.push({coll:'deals', id: d.id, rec: Object.assign(clone(d), {nextStep: P.text, nextDue: P.due || d.nextDue, nextSet: today(), lastComms: !d.lastComms || d.lastComms < p.date ? p.date : d.lastComms})}); }
  if (p.type === 'newcontact') {
    let orgKind = P.orgKind === 'company' ? 'company' : 'firm', orgId = P.orgId;
    if (P.newOrg) {
      orgKind = 'firm'; orgId = uid('f');
      writes.push({coll:'firms', id: orgId, rec: Object.assign({sectors: [], verticals: [], geos: [], countries: [], tickets: [], stages: [], capital: [], fundSize: null, ranking: 'Track', desc: ''}, clone(P.newOrg), {rms: [p.owner], created: today()})});
    }
    const org = P.newOrg || rec(orgKind === 'company' ? 'companies' : 'firms', orgId);
    writes.push({coll:'people', id: uid('p'), rec: {name: P.name, orgType: orgKind, orgId, title: P.title || '', email: P.email, phone: P.phone || '', category: orgKind === 'company' ? 'Prospect Client' : INVESTOR_TYPES.includes(org?.type) ? 'Investor' : 'Corporate Contact', strength: 'Warm', rms: [p.owner], lastContact: p.date, country: org?.hq || org?.country || null, created: today(), source: 'Email scan'}});
  }
  if (p.type === 'crmupdate') { const {coll, r} = crmTarget(P); writes.push({coll, id: r.id, rec: Object.assign(clone(r), {[P.field]: crmNewValue(P, r)})}); }
  writes.push({coll:'proposals', id: pr.id, rec: pr});
  return writes;
}
ACTIONS.emailScan = () => {
  const m = openModal({title: '<span class="agent-tag" style="font-size:11px">Agent</span> Email scan', size: 'wide', body: `<div id="es"><p><span class="spinner"></span> Scanning ${esc(tName(me()))}’s recent emails (simulated)…</p></div>`, foot: `<span class="left muted" style="font-size:12px">Only you see your proposals. Approved items become normal records for everyone.</span><button class="btn primary" data-close>Done</button>`, onMount: el => setTimeout(() => draw(el), 650)});
  function draw(el){
    const mine = all('proposals').filter(p => p.owner === me());
    const pending = mine.filter(p => p.state === 'pending').sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const decided = mine.filter(p => p.state !== 'pending').sort((a, b) => (b.decidedAt || '').localeCompare(a.decidedAt || '')).slice(0, 8);
    const body = $('#es', el); if (!body) return;
    body.innerHTML = `<div class="okbox" style="margin-bottom:10px">Demo: no mailbox is read. These are sample proposals the scan “found”. ${pending.length} waiting for your decision.</div>` +
      (pending.length ? pending.map(p => { const fp = propFrom(p); p = Object.assign({}, p, fp ? {fromId: fp.id, fromName: fp.name, fromOrg: orgName(fp), fromEmail: fp.email} : {}); return `<div class="prop"><div><div class="ptype">${esc(PROPOSAL_TYPES[p.type])}</div><div class="mono faint">${fmtDate(p.date)}</div></div><div><div><b>${esc(p.subject)}</b></div><div class="from">From ${p.fromId ? link('person', p.fromId, p.fromName, '') : esc(p.fromName)} · ${esc(p.fromOrg)} · ${esc(p.fromEmail)}</div><div style="margin-top:3px">${esc(p.summary)}</div><div class="change">${proposalChange(p)}</div></div>
        <div><label class="sub2" for="pd-${p.id}">Decision</label><select id="pd-${p.id}" data-prop="${p.id}" style="width:100%;padding:5px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface)"><option value="">Choose…</option><option value="approve" ${proposalCan(p, p.type) ? '' : 'disabled'}>Approve</option><option value="dismiss">Dismiss</option><option value="reclass">Wrong type – reclassify</option></select></div></div>`; }).join('') : '<div class="empty">No new proposals. Your inbox is up to date.</div>') +
      (decided.length ? `<details style="margin-top:12px"><summary class="muted" style="cursor:pointer">Recently decided (${decided.length})</summary>${decided.map(p => `<div class="li"><div class="grow"><b>${esc(p.subject)}</b><div class="meta">${esc(PROPOSAL_TYPES[p.type])} · ${esc(p.fromName)}</div></div><span class="pill ${p.state === 'approved' ? 'g' : ''}">${esc(p.state === 'approved' ? 'Approved' : 'Dismissed')}</span></div>`).join('')}</details>` : '');
    body.onchange = async e => {
      const id = e.target.dataset.prop; if (!id) return; const p = rec('proposals', id); const v = e.target.value; if (!v) return;
      if (v === 'approve') { const fp = propFrom(p); await act(`Approved scan proposal: ${PROPOSAL_TYPES[p.type].toLowerCase()} (${p.subject})`, approveWrites(Object.assign(clone(p), fp ? {fromId: fp.id, fromName: fp.name} : {})), {source: 'email scan'}); draw(el); }
      if (v === 'dismiss') { await act(`Dismissed scan proposal “${p.subject}”`, [{coll:'proposals', id, rec: Object.assign(clone(p), {state: 'dismissed', decidedBy: me(), decidedAt: today()})}], {source: 'email scan'}); draw(el); }
      if (v === 'reclass') { e.target.value = ''; reclassify(p, () => draw(el)); }
    };
  }
};
function reclassify(p, done){
  openModal({title: 'Wrong type – reclassify', size: 'narrow', body: `<p style="margin-top:0">The scan proposed <b>${esc(PROPOSAL_TYPES[p.type])}</b> for “${esc(p.subject)}”.</p>${p.note ? `<p class="muted">${esc(p.note)}</p>` : ''}
    <div class="fld"><label for="rc-t">What should it be?</label><select id="rc-t">${Object.entries(PROPOSAL_TYPES).filter(([k]) => k !== p.type).map(([k, l]) => `<option value="${k}" ${proposalCan(p, k) ? '' : 'disabled'}>${esc(l)}${proposalCan(p, k) ? '' : ' (not possible for this email)'}</option>`).join('')}</select></div>
    <div class="fld" style="margin-top:10px"><label for="rc-f">Feedback for the scan<span class="req">*</span></label><textarea id="rc-f" placeholder="e.g. A request to catch up is a follow-up, not an opportunity."></textarea><span class="help">Saved as a scan lesson. You can see and delete lessons in Settings.</span></div>`,
    foot: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="rc-s">Reclassify</button>`, onMount: el => {
      $('#rc-s', el).onclick = async () => {
        const to = $('#rc-t', el).value, fb = $('#rc-f', el).value.trim(); if (!fb) { toast('Add a line of feedback so the scan can learn.', true); return; }
        const P = clone(p.payload || {}); if (to === 'followup' && !P.text) P.text = 'Follow up with ' + p.fromName + ': ' + p.subject; if (to === 'lastcomms') { P.personId = P.personId || propFrom(p)?.id; P.date = P.date || p.date; }
        closeModal();
        await act(`Reclassified scan proposal “${p.subject}” as ${PROPOSAL_TYPES[to].toLowerCase()}`, [{coll:'proposals', id: p.id, rec: Object.assign(clone(p), {type: to, payload: P, note: '', reclassifiedFrom: p.type})}, {coll:'lessons', id: uid('l'), rec: {by: me(), fromType: p.type, toType: to, feedback: fb, date: today(), proposalId: p.id}}], {source: 'email scan'});
        done && done();
      };
    }});
}

/* ============================================================
   Origination: coverage themes, companies likely to need an adviser,
   triggers, an explainable mandate score, triage, pitch angles,
   pitch notes and a dashboard.
   (Internal names keep the older "sourcing", "theses" and "cands" keys.)
   ============================================================ */
const PARTS = ['sector','geo','size','triggers','access','timing'];
const PART_LABEL = {sector:'Coverage fit', geo:'Geography', size:'Deal size', triggers:'Triggers', access:'Way in', timing:'Timing'};
const DEF_WEIGHTS = {sector:20, geo:15, size:15, triggers:25, access:15, timing:10};
const ORIG_MANDATES = ['Sell-side','Buy-side','Capital raise','Debt raise'];
const DISMISS_REASONS = ['Outside coverage','Out of geography','Too small','Too large','No clear trigger','No way in','Already advised by another firm','Conflict with a client','Duplicate','Other'];
const TRIGGERS = ['Strategic review','PE hold period','Succession','Debt maturity','Management change','Expansion plans','Competitor acquired','Regulatory change','Press'];
const TRIG_PTS = {'Strategic review':45, 'PE hold period':35, Succession:35, 'Debt maturity':30, 'Management change':25, 'Expansion plans':25, 'Competitor acquired':20, 'Regulatory change':15, Press:10};
const TRIG_SIGNAL = {'PE hold period':'Hold period', 'Management change':'Management change', 'Debt maturity':'Refinancing', 'Regulatory change':'Regulatory filing'};
const ACCESS = ['Direct','Via sponsor','Second-degree','None'];
const ACCESS_PTS = {Direct:100, 'Via sponsor':75, 'Second-degree':45, None:10};
const SRC_FEEDS = ['Company registry filings','Deal announcements','PE fund tracker','Leadership moves','Debt maturity tracker','News agent','Team referral'];
const revBand = r => r == null ? '' : r < 5 ? SIZE_BANDS[0] : r < 25 ? SIZE_BANDS[1] : r < 100 ? SIZE_BANDS[2] : SIZE_BANDS[3];
const FEE_PCT = {'Sell-side':2, 'Capital raise':2.5, 'Debt raise':1, 'Buy-side':1.5};
const feeEst = (mandate, size) => size ? Math.max(0.15, Math.round(Math.round(size * (FEE_PCT[mandate] || 1.5) / 100 / 0.05) * 0.05 * 100) / 100) : null;
const fmtM = x => x == null || x === '' ? '' : 'US$' + (+x >= 10 ? Math.round(+x) : Math.round(+x * 10) / 10) + 'm';

/* ---------- the scoring model: stored, explainable, versioned ---------- */
function inGeo(t, country){
  const reg = regionOf(country);
  if (arr(t.countries).includes(country)) return 'country';
  const g = arr(t.geos);
  if (g.includes(reg) || (g.includes('Pan-Africa') && reg.startsWith('Africa')) || (g.includes('Sub-Saharan Africa') && reg.startsWith('Africa') && reg !== 'Africa – North')) return 'region';
  return null;
}
function scoreCand(c, t, asOf){
  asOf = asOf || today();
  const parts = {}, why = [];
  if (arr(t.verticals).includes(c.vertical)) { parts.sector = 100; why.push(['+', `${c.vertical} is core to this theme`]); }
  else if (arr(t.sectors).includes(c.sector)) { parts.sector = 60; why.push(['~', `${c.sector}, but ${c.vertical} is not a core sub-sector`]); }
  else { parts.sector = 10; why.push(['-', `${c.vertical} sits outside this theme`]); }
  const g = inGeo(t, c.country);
  if (g === 'country') { parts.geo = 100; why.push(['+', `${c.country} is a focus market`]); }
  else if (g === 'region') { parts.geo = 70; why.push(['~', `${c.country} is in a target region, not a focus market`]); }
  else { parts.geo = 10; why.push(['-', `${c.country} is outside the theme's geography`]); }
  const ds = +c.dealSize || 0, lo = +t.dealMin || 0, hi = +t.dealMax || 1e9;
  if (!ds) { parts.size = 40; why.push(['~', 'Deal size not yet estimated']); }
  else if (ds >= lo && ds <= hi) { parts.size = 100; why.push(['+', `Estimated deal of ${fmtM(ds)} is in the ${fmtM(lo)}–${fmtM(hi)} range`]); }
  else if (ds >= lo * .5 && ds <= hi * 1.5) { parts.size = 50; why.push(['~', `Estimated deal of ${fmtM(ds)} is just ${ds < lo ? 'below' : 'above'} the range`]); }
  else { parts.size = 10; why.push(['-', `Estimated deal of ${fmtM(ds)} is ${ds < lo ? 'too small' : 'too large'} for this theme`]); }
  const recent = arr(c.triggers).filter(s => s.date >= addDays(asOf, -180));
  parts.triggers = Math.min(100, recent.reduce((s, x) => s + (TRIG_PTS[x.type] || 10), 0));
  why.push([parts.triggers >= 50 ? '+' : parts.triggers > 0 ? '~' : '-', recent.length ? `${recent.length} trigger${recent.length === 1 ? '' : 's'} in six months: ${uniq(recent.map(s => s.type.toLowerCase())).join(', ')}` : 'No triggers in the last six months']);
  const a = c.access || {level: 'None'};
  parts.access = ACCESS_PTS[a.level] ?? 10;

    <div class="muted" style="max-width:90ch">${esc(t.desc || '')}</div>
    <div class="chips">${[...arr(t.mandates), ...arr(t.verticals), ...arr(t.countries).length ? arr(t.countries) : arr(t.geos)].map(x => `<span class="chip" style="cursor:default">${esc(x)}</span>`).join('')}<span class="chip" style="cursor:default">Deal ${fmtM(t.dealMin)}–${fmtM(t.dealMax)}</span><span class="chip" style="cursor:default">Threshold ${t.threshold}</span><span class="chip" style="cursor:default" title="Scoring weights">${PARTS.map(k => PART_LABEL[k] + ' ' + (t.weights || DEF_WEIGHTS)[k]).join(' · ')}</span></div>
    <div class="sub2">Owner ${esc(tName(t.owner))} · model v${t.version || 1}</div></div>
    <label class="switch" style="margin-left:auto"><input type="checkbox" data-f="sourcing|dash" ${dash ? 'checked' : ''}> Dashboard</label></div>`;
  if (dash) return head + status + tpick + sourcingDash(t, inT);
  const counts = countBy(inT, c => c.status);
  const VIEWS_ = [['review','To review','new'],['watch','Watching','watch'],['approved','Approved','approved'],['dismissed','Dismissed','dismissed'],['all','All',null]];
  let rows = inT.filter(c => { const vv = VIEWS_.find(x => x[0] === view); return !vv || !vv[2] || c.status === vv[2]; });
  const sb = fget('sourcing', 'band', []);
  rows = rows.filter(c => fIn('sourcing', 'country', c.country) && fIn('sourcing', 'vert', c.vertical) && fIn('sourcing', 'own', c.ownership) && fIn('sourcing', 'mand', c.mandate) && fIn('sourcing', 'trig', arr(c.triggers).map(x => x.type)) && fIn('sourcing', 'feed', arr(c.sources).map(s => s.feed)) && (!sb.length || sb.includes(band(scoreOf(c, t.id)?.score))));
  if (fget('sourcing', 'crm', false)) rows = rows.filter(c => crmMatch(c));
  if (fget('sourcing', 'fresh', false)) rows = rows.filter(c => c.discovered >= addDays(today(), -7) || c.updatedAt >= addDays(today(), -7));
  if (q.length) rows = rows.filter(c => { const h = [c.name, c.country, c.vertical, c.ownership, c.ownerName, c.mandate, c.desc, arr(c.mgmt).map(m => m.name).join(' '), c.access?.who, arr(c.triggers).map(s => s.text).join(' ')].join(' ').toLowerCase(); return q.every(w => h.includes(w)); });
  const cols = [
    {key:'name', label:'Company', sort: c => c.name, render: c => { const m = crmMatch(c); return `<a href="#" class="rowlink" data-open="cand:${c.id}" data-hc="${esc(c.desc)}">${esc(c.name)}</a><div class="sub2">${esc(c.country)} · founded ${esc(c.founded)}</div><div class="chips" style="margin-top:3px">${c.discovered >= addDays(today(), -2) ? '<span class="pill b">New</span>' : ''}${c.updatedAt >= addDays(today(), -2) ? '<span class="pill a">Updated</span>' : ''}${m ? `<a href="#" class="pill g" data-open="company:${m.id}" title="Already in the CRM">In CRM</a>` : ''}${arr(c.thesisIds).length > 1 ? `<span class="pill v" title="Fits ${arr(c.thesisIds).length} themes">${arr(c.thesisIds).length} themes</span>` : ''}</div>`; }},
    {key:'vert', label:'Sub-sector', sort: c => c.vertical, render: c => `${esc(c.vertical)}<div class="sub2">${esc(c.sector)}</div>`},

    {key:'mand', label:'Likely mandate', sort: c => c.mandate, render: c => `${esc(c.mandate || '')}<div class="sub2">Deal ~${fmtM(c.dealSize)} · fee ~${fmtM(feeEst(c.mandate, c.dealSize))}</div>`},
    {key:'score', label:'Mandate score', sort: c => -(scoreOf(c, t.id)?.score ?? -1), render: c => scoreCell(c, t)},
    {key:'why', label:'Why', render: c => { const s = scoreOf(c, t.id); return s ? `<div style="max-width:300px;font-size:12px">${s.why.filter(w => w[0] === '+').slice(0, 2).map(w => `<div style="color:var(--good)">${esc(w.slice(2))}</div>`).join('')}${s.why.filter(w => w[0] === '-').slice(0, 1).map(w => `<div style="color:var(--bad)">${esc(w.slice(2))}</div>`).join('')}</div>` : ''; }},
    {key:'sig', label:'Latest trigger', sort: c => arr(c.triggers)[0]?.date || '', render: c => { const s = arr(c.triggers)[0]; return s ? `<div style="max-width:230px;font-size:12px"><span class="pill">${esc(s.type)}</span> <span class="mono">${fmtDate(s.date)}</span><div>${esc(s.text)}</div></div>` : '<span class="faint">None</span>'; }},
    {key:'way', label:'Way in', sort: c => ACCESS.indexOf(c.access?.level || 'None'), render: c => { const a = c.access || {level: 'None'}; return `<span class="pill ${a.level === 'Direct' ? 'g' : a.level === 'Via sponsor' ? 'g' : a.level === 'Second-degree' ? 'a' : 'r'}">${esc(a.level)}</span>${a.who ? `<div class="sub2" style="max-width:190px">${esc(a.who)}</div>` : ''}`; }},

const band = s => s == null ? '' : s >= 80 ? '80' : s >= 60 ? '60' : s >= 40 ? '40' : '0';

function triageButtons(c, t){

/* ---------- score explanation ---------- */
function scoreBreakdown(c, t){
  const s = scoreOf(c, t.id); if (!s) return '<div class="empty">Not scored yet.</div>';
  const w = Object.assign({}, DEF_WEIGHTS, t.weights || {}); const tw = PARTS.reduce((a, k) => a + (+w[k] || 0), 0) || 1;
  return `<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:8px"><span style="font-family:var(--f-display);font-size:40px;font-weight:700;color:${scoreColor(s.score)}">${s.score}</span><span class="muted">out of 100 on “${esc(t.title)}” · threshold ${t.threshold} · model v${s.v}, scored ${fmtDate(s.at)}${isStale(c, t) ? ' · <b style="color:var(--warn)">out of date</b>' : ''}</span></div>
  <div class="bars">${PARTS.map(k => `<div class="bar" style="grid-template-columns:110px 1fr 90px"><span class="lab">${PART_LABEL[k]}</span><span class="trk"><i style="width:${s.parts[k]}%;background:${scoreColor(s.parts[k])}"></i></span><span class="v">${s.parts[k]} × ${Math.round((+w[k] || 0) / tw * 100)}%</span></div>`).join('')}</div>
  <ul style="margin:10px 0 0;padding-left:0;list-style:none">${s.why.map(x => `<li style="margin:3px 0"><b style="color:${x[0] === '+' ? 'var(--good)' : x[0] === '-' ? 'var(--bad)' : 'var(--warn)'};display:inline-block;width:16px">${x[0] === '~' ? '±' : x[0]}</b>${esc(x.slice(2))}</li>`).join('')}${s.kw && s.kw.length ? `<li><b style="color:var(--good);display:inline-block;width:16px">+</b>Theme keywords found: ${esc(s.kw.join(', '))} (+${Math.min(6, s.kw.length * 3)})</li>` : ''}</ul>`;
}
ACTIONS.scoreWhy = (arg, el) => { const [cid, tid] = arg.split(':'); const c = rec('cands', cid), t = rec('theses', tid); openModal({title: 'Why this score', size: 'narrow', body: `<div style="font-weight:600;margin-bottom:6px">${esc(c.name)}</div>${scoreBreakdown(c, t)}`, foot: `<button class="btn" data-open="cand:${cid}" data-close>Open company</button><button class="btn primary" data-close>Close</button>`}); };

    <div class="form"><div class="fld"><label for="ap-m">Mandate type</label><select id="ap-m">${MANDATES.map(x => `<option ${x === c.mandate ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
    <div class="fld"><label for="ap-r">Relevance</label><select id="ap-r">${LEVELS.map(x => `<option ${x === (s && s.score >= 80 ? 'High' : 'Medium') ? 'selected' : ''}>${x}</option>`).join('')}</select></div>

    <div class="fld full"><label for="ap-why">Why now</label><textarea id="ap-why">${esc(`Origination: “${t.title}”${s ? ` (score ${s.score})` : ''}. ${ownerLine(c)}; revenue about ${fmtM(c.revenue)}. ${trig ? trig.text + '.' : ''}`.trim())}</textarea></div></div>`,

          arr(c.mgmt).slice(0, 2).forEach(f => writes.push({coll:'people', id: uid('p'), rec: {name: f.name, orgType: 'company', orgId: cid, title: f.role === 'CEO' ? 'Chief Executive Officer' : f.role === 'CFO' ? 'Chief Financial Officer' : f.role, category: 'Prospect Client', strength: c.access?.level === 'Direct' && f.role !== 'CEO' ? 'Warm' : 'No contact yet', email: f.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z ]/g, '').replace(/ +/g, '.') + '@example.com', phone: '', rms: st.rms, lastContact: null, country: c.country, created: today()}}));
          if (c.sponsorId && rec('firms', c.sponsorId)) writes.push({coll:'holdings', id: uid('h'), rec: {firmId: c.sponsorId, companyId: cid, since: c.lastDeal?.year ? String(c.lastDeal.year) : ''}});

};

/* ---------- agent run (simulated) and re-scoring ---------- */
ACTIONS.srcRun = async () => {
  const pool = all('cands').filter(c => c.hidden).sort((a, b) => a.id.localeCompare(b.id, undefined, {numeric: true}));
  const t0 = toastLoading('Origination agent is scanning its feeds (sample pool)…');
  await new Promise(r => setTimeout(r, 900)); t0.remove();
  const batch = pool.slice(0, 7);
  const vis = all('cands').filter(c => !c.hidden && c.status !== 'dismissed');
  const upd = vis.sort((a, b) => hashId(a.id + today()) % 97 - hashId(b.id + today()) % 97).slice(0, 3);
  const meta = clone(rec('meta', 'srcAgent') || {runs: []});
  if (!batch.length && !upd.length) { toast('The agent found nothing new in the sample pool.'); return; }
  const writes = [];
  const runNo = arr(meta.runs).length + 1;
  for (const c of batch) {
    const n = clone(c); n.hidden = false; n.discovered = today(); n.batch = runNo; n.sources = arr(n.sources).map(s => Object.assign(s, {date: today()}));
    for (const tid of arr(n.thesisIds)) { const t = rec('theses', tid); if (t) n.scores[tid] = scoreCand(n, t); }
    writes.push({coll:'cands', id: c.id, rec: n});
  }
  const SIG = [['Management change', () => 'Appointed a new CFO from a listed peer'], ['Strategic review', () => 'Board announced a review of strategic options'], ['Debt maturity', c => `${fmtM(Math.round((c.dealSize || 20) * .6))} facility matures next year`], ['Competitor acquired', () => 'A close competitor was bought by a regional strategic buyer']];
  upd.forEach((c, k) => {
    const n = clone(c); const [type, fn] = SIG[k % SIG.length];
    n.triggers = [{type, date: today(), text: fn(n)}, ...arr(n.triggers)]; n.updatedAt = today();
    for (const tid of arr(n.thesisIds)) { const t = rec('theses', tid); if (t) n.scores[tid] = scoreCand(n, t); }
    writes.push({coll:'cands', id: c.id, rec: n});
  });
  meta.lastRun = Date.now(); meta.runs = [...arr(meta.runs), {at: today(), added: batch.length, updated: upd.length}].slice(-30);
  writes.push({coll:'meta', id: 'srcAgent', rec: meta});
  await act(`Origination agent run: ${batch.length} new compan${batch.length === 1 ? 'y' : 'ies'}, ${upd.length} with new triggers`, writes, {source: 'agent', toast: `Demo agent run: ${batch.length} new companies from the sample pool, ${upd.length} with new triggers`});
};
ACTIONS.srcRescore = async tid => { const t = rec('theses', tid); const cs = all('cands').filter(c => arr(c.thesisIds).includes(tid)); await act(`Re-scored ${cs.length} companies on “${t.title}” (model v${t.version || 1})`, rescoreWrites(t, cs), {source: 'agent'}); };

/* ---------- coverage themes ---------- */
ACTIONS.thesisNew = () => thesisForm(null);
ACTIONS.thesisDel = id => {
  const t = rec('theses', id); if (!t) return;

function lessonSuggestions(t){

  if ((cnt['Too large'] || 0) >= 3) out.push(`${cnt['Too large']} dismissed as too large. Consider lowering the maximum deal size from ${fmtM(t.dealMax)}.`);
  if ((cnt['Out of geography'] || 0) >= 3) out.push(`${cnt['Out of geography']} dismissed for geography. Consider raising the geography weight from ${w.geo}.`);
  if ((cnt['Outside coverage'] || 0) >= 3) out.push(`${cnt['Outside coverage']} dismissed as outside coverage. Consider narrowing the sub-sectors or raising the coverage weight from ${w.sector}.`);
  if ((cnt['No clear trigger'] || 0) >= 3) out.push(`${cnt['No clear trigger']} dismissed for having no clear trigger. Consider raising the trigger weight from ${w.triggers}.`);
  if ((cnt['No way in'] || 0) >= 2) out.push(`${cnt['No way in']} dismissed because nobody knows them. Consider raising the way-in weight from ${w.access}.`);
  if ((cnt['Conflict with a client'] || 0) >= 2) out.push(`${cnt['Conflict with a client']} dismissed over client conflicts. Check the theme doesn't overlap a client's competitors.`);
  return out;
}

  const types = mand === 'Sell-side' ? ['Strategic','Private Equity','Investment Holding'] : mand === 'Debt raise' ? ['Bank','DFI','Asset Finance','Asset Manager'] : mand === 'Buy-side' ? ['Strategic','Private Equity'] : ['Private Equity','DFI','Impact','Family Office','Asset Manager','Pension Fund'];
  const cp = all('firms').filter(f => types.includes(f.type) && (arr(f.sectors).includes(c.sector) || arr(f.sectors).includes('Sector-Agnostic')))
    .map(f => ({f, s: (arr(f.sectors).includes(c.sector) ? 2 : 0) + (arr(f.countries).includes(c.country) ? 1.5 : 0) + (f.ranking === 'Yes' ? 1 : 0)})).sort((a, b) => b.s - a.s).slice(0, 8)
    .map(({f}) => ({name: f.name, type: f.type, ticket: arr(f.tickets).join(', '), hq: f.hq}));
  const clients = all('deals').filter(d => !['Completed','Lost'].includes(d.stage) && arr(d.sectors).includes(c.sector)).map(d => ({deal: dealName(d), client: rec('companies', d.clientId)?.name, country: d.country}));
  return {possible_counterparties_in_crm: cp, live_deals_in_same_sector: clients.slice(0, 6)};
}
function candFacts(c, t){
  const s = t ? scoreOf(c, t.id) : null;
  return Object.assign({company: c.name, country: c.country, sector: c.sector, sub_sector: c.vertical, ownership: c.ownership, owner: c.ownerName, years_held_by_owner: c.holdYears, founded: c.founded, revenue_musd: c.revenue, revenue_band: c.revenueBand, employees: c.employees, last_transaction: c.lastDeal, what_they_do: c.desc, likely_mandate: c.mandate, est_deal_size_musd: c.dealSize, est_fee_musd: feeEst(c.mandate, c.dealSize), management: c.mgmt, triggers: arr(c.triggers).slice(0, 8), way_in: c.access, sources: arr(c.sources).map(x => x.feed),
    theme: t ? {title: t.title, description: t.desc, sub_sectors: t.verticals, regions: t.geos, countries: t.countries, mandates: t.mandates, deal_size_musd: [t.dealMin, t.dealMax], threshold: t.threshold} : null,
    model_score: s ? {score: s.score, parts: s.parts, reasons: s.why} : null, already_in_crm: !!crmMatch(c)}, crmContext(c));
}
ACTIONS.candAi = async (arg, btn) => {
  const [id, tid] = arg.split(':'); const c = rec('cands', id), t = rec('theses', tid);
  if (!ST.sample) { toast('Claude isn’t available in this view.', true); return; }
  btn.disabled = true; const tl = toastLoading(`✦ Claude is working out a pitch angle for ${c.name}…`);
  try {
    const r = await ST.sample.json(`You are a corporate finance adviser at ${BANK} working out the pitch angle on a company that may need an adviser. Use ONLY the facts given; say what is unknown. Name counterparties only from possible_counterparties_in_crm, and flag live deals in the same sector as possible conflicts. Be concise.
FACTS: ${JSON.stringify(candFacts(c, t))}
Reply with only JSON: {"rating":"Strong"|"Possible"|"Weak","suggested_score":0-100,"mandate":"Sell-side"|"Buy-side"|"Capital raise"|"Debt raise","why_now":"one or two sentences","angle":"two sentences on how to pitch","who_we_know":["…"],"counterparties":["name: one-line reason"],"conflicts":["…"],"unknowns":["…"]}`, {modelTier: 'default'});
    const ai = Object.assign({}, c.ai || {}, {[tid]: {rating: r.rating, suggested_score: Math.max(0, Math.min(100, +r.suggested_score || 0)), mandate: r.mandate, why_now: r.why_now, angle: r.angle, who_we_know: arr(r.who_we_know).slice(0, 4), counterparties: arr(r.counterparties).slice(0, 6), conflicts: arr(r.conflicts).slice(0, 4), unknowns: arr(r.unknowns).slice(0, 5), at: today(), by: me()}});
    tl.remove(); await act(`Claude drafted a pitch angle for ${c.name}`, [{coll:'cands', id, rec: Object.assign(clone(c), {ai})}], {source: 'agent'});
  } catch (e) { tl.remove(); if (e && e.code !== 'cancelled') toast(e && e.code === 'not_granted' ? 'Claude wasn’t allowed for this desk.' : 'Claude couldn’t work out a pitch angle. Try again.', true); }
  finally { btn.disabled = false; }
};
ACTIONS.candMemo = async (arg, btn) => {
  const [id, tid] = arg.split(':'); const c = rec('cands', id), t = rec('theses', tid);
  if (!ST.sample) { toast('Claude isn’t available in this view.', true); return; }
  btn.disabled = true; const tl = toastLoading(`✦ Claude is drafting a pitch note on ${c.name}…`);
  try {
    const r = await ST.sample.json(`Draft a one-page pitch note for the advisory team at ${BANK} on a company that may need an adviser. Use ONLY the facts given; never invent numbers, owners or counterparties. Name counterparties only from possible_counterparties_in_crm.
FACTS: ${JSON.stringify(Object.assign(candFacts(c, t), {claude_pitch_angle: c.ai && c.ai[tid] ? c.ai[tid] : null}))}
Reply with only JSON: {"snapshot":"2-3 sentences","why_now":"1-2 sentences","mandate_hypothesis":"1-2 sentences","counterparties":["3-6 names with a one-line reason"],"approach":["3-4 steps"],"fee_estimate":"one line","risks":["3-4 bullets"],"recommendation":"Approach now / Keep warm / Pass, with one-line reason"}
Keep bullets under 25 words.`, {modelTier: 'default'});
    const memo = Object.assign({}, r, {at: today(), by: me(), thesis: tid});
    tl.remove(); await act(`Drafted a pitch note on ${c.name}`, [{coll:'cands', id, rec: Object.assign(clone(c), {memo})}], {source: 'agent'});
    if (!R.rec || R.rec.id !== id) openRecord('cand', id);
  } catch (e) { tl.remove(); if (e && e.code !== 'cancelled') toast(e && e.code === 'not_granted' ? 'Claude wasn’t allowed for this desk.' : 'Claude couldn’t draft the pitch note. Try again.', true); }
  finally { btn.disabled = false; }
};

/* ---------- dashboard ---------- */
function sourcingDash(t, inT){
  const reviewed = inT.filter(c => ['approved','dismissed'].includes(c.status));
  const sc = c => c.scoreAtReview ?? scoreOf(c, t.id)?.score ?? 0;
  const bands = [['80–100', 80, 101], ['60–79', 60, 80], ['40–59', 40, 60], ['Under 40', 0, 40]];
  const prec = bands.map(([l, lo, hi]) => { const r = reviewed.filter(c => sc(c) >= lo && sc(c) < hi); const a = r.filter(c => c.status === 'approved').length; return {l, n: r.length, a, p: r.length ? Math.round(a / r.length * 100) : null}; });
  const over = reviewed.filter(c => (c.status === 'approved' && sc(c) < t.threshold) || (c.status === 'dismissed' && sc(c) >= t.threshold));
  const missed = over.filter(c => c.status === 'approved'), falsePos = over.filter(c => c.status === 'dismissed');
  const promoted = inT.filter(c => c.oppId && rec('opps', c.oppId)?.dealId).length;
  const inPipe = inT.filter(c => c.oppId && rec('opps', c.oppId)).length;
  const fees = inT.filter(c => c.oppId && rec('opps', c.oppId)).reduce((s, c) => s + (+rec('opps', c.oppId).estFee || 0), 0);
  const above = inT.filter(c => (scoreOf(c, t.id)?.score || 0) >= t.threshold);
  const covC = countBy(inT, c => c.country);
  const revC = countBy(reviewed.concat(inT.filter(c => c.status === 'watch')), c => c.country);
  const agent = rec('meta', 'srcAgent') || {};
  const sugg = lessonSuggestions(t);
  const ovRow = c => `<div class="li"><div class="grow">${link('cand', c.id, c.name)} <span class="sub2">${esc(c.country)} · ${esc(c.vertical)} · ${esc(c.ownership || '')}</span><div class="meta">${c.status === 'dismissed' ? `Dismissed: ${esc(c.dismissReason || '')}${c.dismissNote ? ' · “' + esc(c.dismissNote) + '”' : ''}` : 'Approved by ' + esc(tName(c.reviewedBy))}</div></div><span style="font-family:var(--f-display);font-size:20px;font-weight:700;color:${scoreColor(sc(c))}">${sc(c)}</span></div>`;
  return `<div class="stats">
    <div class="stat"><b>${inT.length}</b><span>Companies found</span></div>
    <div class="stat"><b>${above.length}</b><span>Above threshold</span></div>
    <div class="stat"><b>${Math.round((reviewed.length + inT.filter(c => c.status === 'watch').length) / Math.max(1, inT.length) * 100)}%</b><span>Reviewed</span></div>
    <div class="stat"><b>${reviewed.length ? Math.round(reviewed.filter(c => c.status === 'approved').length / reviewed.length * 100) + '%' : '–'}</b><span>Approval rate</span></div>
    <div class="stat"><b>${inPipe}</b><span>In pipeline</span></div>
    <div class="stat"><b>${fmtM(fees) || 'US$0m'}</b><span>Estimated fees in pipeline</span></div>
    <div class="stat"><b>${promoted}</b><span>Became live mandates</span></div>
    <div class="stat"><b>${over.length}</b><span>Analyst overrides</span></div></div>
  <div class="dash">
    <div class="chart"><h4>Precision by score band</h4><p class="muted" style="margin:0 0 8px;font-size:12px">Share of reviewed companies that were approved. If the model works, higher bands should approve more often.</p><div class="bars">${prec.map(b => `<div class="bar" style="grid-template-columns:80px 1fr 110px"><span class="lab">${b.l}</span><span class="trk"><i style="width:${b.p || 0}%;background:var(--accent)"></i></span><span class="v">${b.p == null ? 'no reviews' : `${b.p}% · ${b.a}/${b.n}`}</span></div>`).join('')}</div></div>
    ${barChart('Funnel', [['Found', inT.length], ['Reviewed', reviewed.length + inT.filter(c => c.status === 'watch').length], ['Approved', inT.filter(c => c.status === 'approved').length], ['In pipeline', inPipe], ['Live mandate', promoted]])}
    ${barChart('Triggers seen', pairsFrom(countBy(inT.flatMap(c => arr(c.triggers).map(x => x.type)), x => x)))}
    ${barChart('Dismiss reasons', pairsFrom(countBy(inT.filter(c => c.status === 'dismissed'), c => c.dismissReason)), 'var(--bad)')}
    ${barChart('Coverage by country (found / reviewed)', Object.keys(covC).sort((a, b) => covC[b] - covC[a]).slice(0, 10).map(k => [`${k} (${revC[k] || 0} reviewed)`, covC[k]]))}
    ${barChart('Way in', pairsFrom(countBy(inT, c => (c.access || {}).level || 'None')))}
    ${trendChart('Companies found per agent run', arr(agent.runs).slice(-8).map(r => [fmtDate(r.at), r.added]))}
  </div>
  <div class="rec-grid" style="margin-top:12px">
    ${card('Model missed: approved below threshold', missed.map(ovRow).join('') || '<div class="empty">No approvals below the threshold.</div>', '', missed.length)}
    ${card('False positives: dismissed above threshold', falsePos.map(ovRow).join('') || '<div class="empty">No dismissals above the threshold.</div>', '', falsePos.length)}
  </div>
  ${card('What the reviews suggest', sugg.length ? `<ul style="margin:6px 0;padding-left:18px">${sugg.map(x => `<li style="margin:3px 0">${esc(x)}</li>`).join('')}</ul><button class="btn sm" data-act="thesisEdit" data-arg="${t.id}">Adjust the theme</button>` : '<div class="empty">Not enough dismissals yet to suggest changes.</div>')}`;
}
