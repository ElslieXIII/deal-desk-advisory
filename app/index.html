<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal Desk · Advisory · interactive demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a dense operating desk — masthead, tab rail, then full-width tables and record pages. */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --surface-2:#eef1ee; --surface-3:#e4e9e5;
  --line:#d5dcd7; --line-2:#c3ccc6;
  --text:#18221d; --muted:#5d6b63; --faint:#87938c;
  --accent:#0b7a55; --accent-2:#086245; --accent-soft:#dff1e8; --accent-ink:#ffffff;
  --agent:#6b46d6; --agent-soft:#ece6fd;
  --good:#1d8a4e; --good-soft:#dcf2e3;
  --warn:#b26a00; --warn-soft:#fdefd6;
  --bad:#c0352b; --bad-soft:#fbe1de;
  --info:#2563b8; --info-soft:#e0ebfa;
  --shadow:0 8px 28px rgba(16,28,22,.16), 0 1px 3px rgba(16,28,22,.08);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1512; --surface:#161e1a; --surface-2:#1c2621; --surface-3:#243029;
    --line:#2b3832; --line-2:#3a4942;
    --text:#e3ebe6; --muted:#9aa9a1; --faint:#6f7e76;
    --accent:#2fb07f; --accent-2:#45c493; --accent-soft:#16352a; --accent-ink:#06130d;
    --agent:#a68bff; --agent-soft:#2a2346;
    --good:#4cc47f; --good-soft:#163323;
    --warn:#e7a23a; --warn-soft:#3a2b12;
    --bad:#f0736a; --bad-soft:#3d1c1a;
    --info:#6fa6f0; --info-soft:#17283f;
    --shadow:0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#161e1a; --surface-2:#1c2621; --surface-3:#243029;
  --line:#2b3832; --line-2:#3a4942;
  --text:#e3ebe6; --muted:#9aa9a1; --faint:#6f7e76;
  --accent:#2fb07f; --accent-2:#45c493; --accent-soft:#16352a; --accent-ink:#06130d;
  --agent:#a68bff; --agent-soft:#2a2346;
  --good:#4cc47f; --good-soft:#163323;
  --warn:#e7a23a; --warn-soft:#3a2b12;
  --bad:#f0736a; --bad-soft:#3d1c1a;
  --info:#6fa6f0; --info-soft:#17283f;
  --shadow:0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
.mono,.num,time{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Masthead */
.mast{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:26px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.brand .sub{color:var(--muted);font-size:12px;white-space:nowrap}
.demo-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);white-space:nowrap;cursor:help}
.demo-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
.mast-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.viewas{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.viewas select{padding:4px 6px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--text);font-weight:600}

/* Tabs */
.tabrail{display:flex;align-items:stretch;gap:2px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:20}
.tab{display:flex;align-items:center;gap:6px;padding:10px 10px 9px;border:0;background:none;cursor:pointer;color:var(--muted);font-family:var(--f-display);font-size:14.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.badge{font-family:var(--f-mono);font-size:10.5px;padding:0 6px;border-radius:999px;background:var(--surface-3);color:var(--muted);line-height:17px;font-weight:500;letter-spacing:0}
.badge.red{background:var(--bad);color:#fff}
.tabrail .today{margin-left:auto;align-self:center;color:var(--muted);font-family:var(--f-mono);font-size:12px;white-space:nowrap;padding-left:16px}

main{padding:16px 20px 60px;max-width:2200px;margin:0 auto}
.viewhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.viewhead h2{font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.info-btn{width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font:600 11px var(--f-body);cursor:pointer;display:inline-grid;place-items:center;padding:0}
.info-btn:hover{color:var(--accent);border-color:var(--accent)}
.viewhead .spacer{flex:1}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;font-size:12.5px;white-space:nowrap;line-height:1.4}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);color:var(--accent-ink)}
.btn.agent{border-color:color-mix(in srgb,var(--agent) 50%,transparent);color:var(--agent)}
.btn.agent:hover{background:var(--agent-soft)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{padding:2px 7px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{width:30px;height:30px;padding:0;justify-content:center}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:inherit}
.linkbtn:hover{text-decoration:underline}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:4px 10px;cursor:pointer;font-size:12px;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button .badge{margin-left:4px}

/* Filter bar */
.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:var(--r);padding:0 8px;background:var(--surface);min-width:220px;flex:0 1 300px}
.search input{border:0;background:none;outline:none;padding:5px 0;width:100%}
.ms{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:12px;white-space:nowrap}
.ms.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.ms::after{content:"▾";font-size:9px;color:var(--faint)}
.fcount{margin-left:auto;color:var(--muted);font-size:12px}

/* Tables */
.tw{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
.t th .sortb{display:flex;align-items:center;gap:4px;width:100%;padding:7px 8px;border:0;background:none;cursor:pointer;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
.t th .sortb:hover{color:var(--text)}
.t th .arr{font-size:10px;color:var(--faint)}
.t th.sorted .arr{color:var(--accent)}
.t th.plain{padding:7px 8px}
.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.t tr.hi td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.t tr.top td:first-child{box-shadow:inset 3px 0 0 var(--good)}
.t tr.overdue .due{color:var(--bad);font-weight:600}
.t td.nowrap{white-space:nowrap}
.t select.inl,.t input.inl{border:1px solid transparent;background:transparent;padding:2px 3px;border-radius:4px;max-width:180px;cursor:pointer}
.t select.inl:hover,.t input.inl:hover{border-color:var(--line-2);background:var(--surface)}
.datebtn{border:1px dashed transparent;background:none;padding:1px 4px;border-radius:4px;cursor:pointer;white-space:nowrap;font-size:12px;margin-left:-4px}
.datebtn:hover{border-color:var(--line-2);background:var(--surface)}
.datebtn.od{color:var(--bad);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}
.rowlink{font-weight:600;color:var(--text);cursor:pointer}
.rowlink:hover{color:var(--accent);text-decoration:underline}
.sub2{font-size:11.5px;color:var(--muted)}
.why{font-size:11px;color:var(--agent);margin-top:1px}

/* Edit-in-place */
.eip{cursor:text;border-radius:4px;padding:1px 3px;margin:-1px -3px;min-height:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:340px}
.eip:hover{background:var(--surface-2);outline:1px dashed var(--line-2)}
.eip.empty-eip{color:var(--faint);font-style:italic}
.eip-ta{width:100%;min-width:220px;min-height:70px;border:1px solid var(--accent);border-radius:4px;padding:4px;background:var(--surface);resize:vertical}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--surface-3);color:var(--muted)}
.pill.g{background:var(--good-soft);color:var(--good)}
.pill.a{background:var(--warn-soft);color:var(--warn)}
.pill.r{background:var(--bad-soft);color:var(--bad)}
.pill.b{background:var(--info-soft);color:var(--info)}
.pill.v,.agent-tag{background:var(--agent-soft);color:var(--agent)}
.agent-tag{display:inline-flex;align-items:center;gap:3px;padding:0 6px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.agent-tag::before{content:"✦";font-size:9px}
.idea-tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--info-soft);color:var(--info);margin-left:6px;vertical-align:1px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border:1px solid var(--line-2);border-radius:999px;font-size:11px;background:var(--surface);cursor:pointer;white-space:nowrap;color:var(--text)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.prio{display:inline-flex;align-items:center;gap:6px}
.prio i{width:9px;height:9px;border-radius:2px;display:inline-block}
.src{font-size:11px;color:var(--muted);white-space:nowrap}
.src.scan{color:var(--agent)}

/* Owners */
.owners{display:flex;flex-direction:column;gap:1px;align-items:flex-start}
.own{border:0;background:none;padding:0 2px;margin:0 -2px;cursor:pointer;font-size:12px;border-radius:3px;white-space:nowrap;text-align:left;color:var(--text)}
.own:hover{background:var(--accent-soft);color:var(--accent)}
.own .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:0}
.unassigned{border:1px dashed var(--warn);color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:0 6px;font-size:11px;cursor:pointer;white-space:nowrap}
.own-add{border:0;background:none;color:var(--faint);cursor:pointer;font-size:11px;padding:0 2px}
.own-add:hover{color:var(--accent)}

/* Stage bar */
.stagebar{height:3px;background:var(--surface-3);border-radius:2px;margin-top:3px;width:120px;overflow:hidden}
.stagebar i{display:block;height:100%;background:var(--accent)}

/* Popover / menus */
.pop{position:fixed;z-index:1000;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);min-width:200px;max-width:360px;font-size:12.5px}
.pop .ph{padding:6px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600}
.pop .mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 10px;cursor:pointer}
.pop .mi:hover,.pop .mi.kb{background:var(--surface-2)}
.pop .mi.danger{color:var(--bad)}
.pop hr{border:0;border-top:1px solid var(--line);margin:3px 0}
.ms-pop{width:290px;max-width:92vw;display:flex;flex-direction:column;max-height:380px}
.ms-pop .ms-search{padding:7px;border-bottom:1px solid var(--line)}
.ms-pop .ms-search input{width:100%;padding:5px 7px;border:1px solid var(--line-2);border-radius:5px;background:var(--surface)}
.ms-pop .ms-list{overflow:auto;flex:1;padding:3px 0}
.ms-pop .ms-grp{padding:6px 10px 2px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700}
.ms-pop label{display:flex;align-items:center;gap:8px;padding:4px 10px;cursor:pointer}
.ms-pop label:hover{background:var(--surface-2)}
.ms-pop .ms-foot{border-top:1px solid var(--line);padding:6px;display:flex;gap:6px;justify-content:space-between}
.ms-pop .ms-add{color:var(--accent);font-weight:600}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.45);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.modal{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);width:min(760px,100%);display:flex;flex-direction:column;max-height:90vh}
.modal.wide{width:min(1180px,100%)}
.modal.narrow{width:min(480px,100%)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh h3{font-size:21px;text-transform:uppercase;letter-spacing:.03em}
.modal .mh .x{margin-left:auto}
.modal .mb{padding:16px 18px;overflow:auto}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.modal .mf .left{margin-right:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>label,.fld>.lbl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.fld .req{color:var(--bad);margin-left:2px}
.fld input,.fld select,.fld textarea{padding:6px 8px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);width:100%}
.fld textarea{min-height:70px;resize:vertical}
.fld .ms{justify-content:space-between;width:100%;padding:6px 8px;white-space:normal;text-align:left}
.fld .help{font-size:11px;color:var(--faint)}
.warnbox{padding:7px 10px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:12px}
.okbox{padding:7px 10px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent);font-size:12px}
.inlineblock{border:1px dashed var(--line-2);border-radius:var(--r);padding:10px;background:var(--surface-2)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:30px;height:17px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;transition:background .15s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:15px}
.help-body h4{font-size:15px;text-transform:uppercase;margin:12px 0 4px}
.help-body p,.help-body li{max-width:68ch}
.help-body ul{padding-left:18px;margin:4px 0}

/* Toasts */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--text);color:var(--bg);padding:8px 14px;border-radius:7px;box-shadow:var(--shadow);font-size:12.5px;display:flex;gap:10px;align-items:center;animation:tin .18s ease-out}
.toast.err{background:var(--bad);color:#fff}
.toast button{border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

/* Summary */
.sum-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sum-grid.bottom{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.card .ch{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.card .ch h3{font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.card .cb{padding:4px 12px;flex:1}
.card .cf{padding:8px 12px;border-top:1px solid var(--line);font-size:12px}
.li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .ttl{font-weight:600}
.li .meta{font-size:11.5px;color:var(--muted)}
@media (max-width:1250px){.sum-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.sum-grid,.sum-grid.bottom{grid-template-columns:1fr}}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--surface-2);padding:6px;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted);text-align:center}
.cal .day{background:var(--surface);min-height:108px;padding:4px 5px;position:relative;display:flex;flex-direction:column;gap:2px}
.cal .day.out{background:var(--surface-2);color:var(--faint)}
.cal .day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .day .dn{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.cal .day.today .dn b{background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 4px}
.cal .day .plus{opacity:0;border:0;background:var(--accent-soft);color:var(--accent);border-radius:4px;cursor:pointer;width:18px;height:18px;line-height:16px;padding:0;font-weight:700}
.cal .day:hover .plus{opacity:1}
.cal .ev{font-size:11px;border-radius:4px;padding:1px 5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid;background:var(--surface-2)}
.cal .ev.done{text-decoration:line-through;opacity:.55}
.cal .ev .dots{float:right}
.cal .ev .dots i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:2px}

<script>
/* Demo runtime: lets a Deal Desk run on its own, with no sign-in, database or API key.
   - Data lives in this browser tab only and resets on reload.
   - Sample data is loaded automatically on first open.
   - Claude features return example answers assembled from the demo's own records
     (the real desk sends the same requests to Claude).
   - Excel exports download as normal files. */
(function(){
  window.__DEMO__ = true;
  const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
  const merge = (a, b) => { for (const [k, v] of Object.entries(b)) { if (v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) merge(a[k], v); else a[k] = clone(v); } return a; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const arr = x => Array.isArray(x) ? x : x == null ? [] : [x];
  const uniq = xs => [...new Set(xs)];

  /* ---------- in-memory database with live updates ---------- */
  const store = new Map(), subs = [];
  const collOf = p => p.split('/').slice(0, -1).join('/');
  const notify = path => { const c = collOf(path); subs.filter(s => s.coll === c).forEach(s => setTimeout(s.fire, 0)); };
  const meta = {fromCache: false, hasPendingWrites: false};
  const snapDoc = path => { const d = store.get(path); return {id: path.split('/').pop(), exists: !!d, data: () => d ? clone(d) : undefined, metadata: meta}; };
  function doc(path){ return {id: path.split('/').pop(), path,
    get: async () => snapDoc(path),
    set: async d => { store.set(path, clone(d)); notify(path); },
    update: async d => { if (!store.has(path)) throw {code: 'not_found'}; merge(store.get(path), d); notify(path); },
    delete: async () => { store.delete(path); notify(path); },
    onSnapshot: n => { setTimeout(() => n(snapDoc(path)), 0); return () => {}; },
    collection: p => coll(path + '/' + p)}; }
  function coll(path, q = {}){
    const run = () => { let docs = [...store.keys()].filter(k => collOf(k) === path).sort().map(snapDoc);
      if (q.ob) docs.sort((a, b) => { const x = a.data()[q.ob], y = b.data()[q.ob]; return (x < y ? -1 : x > y ? 1 : 0) * (q.dir === 'desc' ? -1 : 1); });
      if (q.lim) docs = docs.slice(0, q.lim);
      return {docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: meta}; };
    return {path, doc: id => doc(path + '/' + (id || Math.random().toString(36).slice(2))),
      add: async d => { const r = doc(path + '/' + Math.random().toString(36).slice(2)); await r.set(d); return r; },
      where: () => coll(path, q), orderBy: (f, dir) => coll(path, Object.assign({}, q, {ob: f, dir})), limit: n => coll(path, Object.assign({}, q, {lim: n})),
      get: async () => run(),
      onSnapshot: n => { const s = {coll: path, fire: () => n(run())}; subs.push(s); setTimeout(s.fire, 0); return () => { const i = subs.indexOf(s); if (i >= 0) subs.splice(i, 1); }; }};
  }
  const db = {doc, collection: p => coll(p)};

  /* ---------- helpers for example answers ---------- */
  const fmt = d => { if (!d) return ''; const x = new Date(String(d).slice(0, 10) + 'T00:00:00'); return isNaN(x) ? String(d) : x.toLocaleDateString('en-GB', {day: 'numeric', month: 'short'}); };
  const words = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); const w = s.split(' '); return w.length > n ? w.slice(0, n).join(' ') + '…' : s; };
  const firstSentence = s => { s = String(s || '').replace(/\s+/g, ' ').trim(); const m = s.match(/^.*?[.!?](\s|$)/); return words(m ? m[0].trim() : s, 22); };
  const jsonAfter = (s, start, end) => { const i = s.indexOf(start); if (i < 0) return null; const j = end ? s.indexOf(end, i + start.length) : -1; try { return JSON.parse(s.slice(i + start.length, j < 0 ? undefined : j).trim()); } catch { return null; } };
  const quoted = (s, label) => { const m = s.match(new RegExp(label + '\\s*"""([\\s\\S]*?)"""')); return m ? m[1].trim() : ''; };
  const has = (q, v) => v && q.toLowerCase().includes(String(v).toLowerCase());
  const lc = s => String(s || '').toLowerCase();
  const poss = n => /s$/.test(n) ? n + '’' : n + '’s';
  /* lower-case only a leading capital, and only when the next letter is lower case (keeps CTO, US$, names) */

  const REG = q => { const m = lc(q).match(/\b(east|west|north|southern|central) africa/); return m ? lc(q) + ' africa – ' + m[1] : lc(q); };
  const hit = (ql, v) => { const x = lc(v); if (!x) return false; if (ql.includes(x)) return true; return x.split(/[^a-z0-9]+/).some(w => w.length >= 6 && !['services', 'finance', 'financial', 'africa', 'capital'].includes(w) && ql.includes(w)); };

  /* Meeting prep */
  function prep(s){
    const f = jsonAfter(s, 'FACTS (JSON):', '\nReply with') || {};
    const m = f.meeting || {}, org = arr(f.organisations)[0], ppl = arr(f.people), p = ppl[0];
    const deals = arr(f.live_deals), port = arr(f.portfolio), synd = arr(f.syndicate || f.distribution), pipe = arr(f.pipeline);
    const notes = arr(f.notes).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const emails = arr(f.emails), news = arr(f.news), tasks = arr(f.open_tasks);
    const who = p ? `${p.name}${p.title ? ' (' + p.title + (p.organisation ? ', ' + p.organisation : '') + ')' : ''}` : org ? org.name : (m.with || 'this contact');
    let why = '';
    if (deals[0]) why = `${deals[0].name || deals[0].company} is at ${deals[0].stage}${deals[0].next_step ? '; next step: ' + lcFirst(deals[0].next_step).replace(/\.$/, '') : ''}.`;
    else if (port[0]) why = `${port[0].company} is a ${port[0].fund} portfolio company rated ${port[0].health}${port[0].next_board ? ', with a board meeting on ' + fmt(port[0].next_board) : ''}.`;
    else if (synd[0]) why = `${synd[0].investor} is "${synd[0].status}" on ${synd[0].deal}.`;
    else if (pipe[0]) why = `${pipe[0].company} is in the pipeline at "${pipe[0].status}".`;
    else if (p) why = `Relationship is ${lc(p.relationship_strength || 'unknown')}${p.last_contacted ? '; last contact ' + fmt(p.last_contacted) : ''}.`;
    const key = [];
    if (org) {
      if (org.description) key.push(firstSentence(org.description));
      const bits = [org.type, org.hq || org.country, org.ticket ? 'cheques ' + org.ticket : '', org.stage ? org.stage : '', org.total_raised ? 'raised ' + org.total_raised : '', org.headcount ? org.headcount : ''].filter(Boolean);
      if (bits.length) key.push(`${org.name}: ${bits.join(' · ')}.`);
    }
    ppl.slice(0, 2).forEach(x => key.push(`${x.name} — ${x.title || 'role not recorded'}; relationship ${lc(x.relationship_strength || 'unknown')}${x.last_contacted ? ', last contact ' + fmt(x.last_contacted) : ''}.`));
    port.slice(0, 1).forEach(x => key.push(`${x.fund}: cost ${x.cost}, ${x.ownership_pct}% owned, valued at ${x.current_value} (${x.multiple}).`));
    arr(f.portfolio_links).slice(0, 1).forEach(x => key.push(x + '.'));
    const history = [...notes.slice(0, 4).map(n => [n.date, `${fmt(n.date)}: ${n.type}${n.by ? ' (' + n.by + ')' : ''} — ${firstSentence(n.text)}`]), ...emails.slice(0, 2).map(e => [e.date, `${fmt(e.date)}: Email "${e.subject}" — ${words(e.summary, 16)}`])].sort((a, b) => String(b[0]).localeCompare(String(a[0]))).slice(0, 6).map(x => x[1]);
    const inNews = news.slice(0, 3).map(n => `${fmt(n.date)}: ${words(n.headline, 14)} — ${words(n.why_it_matters || n.summary, 14)}`);
    const open = [];
    deals.forEach(d => d.next_step && open.push(`${d.name || d.company}: ${d.next_step}${d.next_step_due ? ' (due ' + fmt(d.next_step_due) + ')' : ''}`));
    port.forEach(x => arr(x.open_asks).slice(0, 2).forEach(a => open.push(`${x.company} asked: ${a}`)));
    synd.slice(0, 3).forEach(r => r.next_steps && open.push(`${r.investor} on ${r.deal}: ${r.next_steps}`));
    tasks.slice(0, 3).forEach(t => open.push(`${t.task}${t.due ? ' (due ' + fmt(t.due) + ')' : ''}`));
    const talk = [];
    deals.forEach(d => { talk.push(`Confirm timing and owners for "${lcFirst(d.next_step || 'the next step')}".`); if (d.lead_investor) talk.push(`Check ${poss(d.lead_investor)} position on terms and board seats.`); });
    port.forEach(x => { const q = arr(x.last_quarters)[0]; if (q) talk.push(`Walk through ${x.key_figure || 'the key figure'} for ${q.q}: ${q.main}; runway ${q.runway} months.`); if (x.exit_route && x.exit_route !== 'Not yet planned') talk.push(`Test appetite for the ${lc(x.exit_route)} route${x.exit_horizon ? ' around ' + x.exit_horizon : ''}.`); });
    synd.filter(r => ['Shared', 'Reviewing'].includes(r.status)).slice(0, 2).forEach(r => talk.push(`Ask ${r.investor} for feedback on ${r.deal}.`));
    pipe.slice(0, 1).forEach(o => talk.push(`Confirm round size, lead and timing for ${o.company}.`));
    if (notes[0]) talk.push(`Ask what has changed since the ${lc(notes[0].type)} on ${fmt(notes[0].date)}.`);
    if (!talk.length) talk.push('Ask about their priorities for the next six months.', 'Explore where we can be useful to each other.');
    const watch = [];
    port.forEach(x => { if (x.health && x.health !== 'Green') watch.push(`${x.company} is rated ${x.health}; be ready to discuss runway and cost plans.`); });
    deals.forEach(d => { const dd = d.due_diligence || {}; Object.entries(dd).filter(([, v]) => v === 'Red flag').forEach(([k]) => watch.push(`${k} diligence has a red flag on ${d.name || d.company}.`)); });
    synd.filter(r => r.status === 'Declined').slice(0, 1).forEach(r => watch.push(`${r.investor} declined ${r.deal}: ${r.feedback || 'reason not recorded'}.`));
    ppl.filter(x => ['Cold', 'No contact yet'].includes(x.relationship_strength)).slice(0, 1).forEach(x => watch.push(`Relationship with ${x.name} is ${lc(x.relationship_strength)}; keep it light.`));
    news.filter(n => /regulat|licen|central bank|rules/i.test(n.headline + ' ' + n.summary)).slice(0, 1).forEach(n => watch.push(`Recent regulatory news: ${words(n.headline, 12)}.`));
    const gaps = [];
    if (!emails.length) gaps.push('No recent emails are logged for this contact.');
    if (!notes.length) gaps.push('No meeting notes on file; this may be a first conversation.');
    else if ((Date.now() - new Date(notes[0].date)) / 864e5 > 60) gaps.push(`Last logged conversation was ${fmt(notes[0].date)}; check what has happened since.`);
    if (org && 'ticket' in org && !org.ticket) gaps.push(`${org.name}'s cheque size is not recorded.`);
    if (p && !p.title) gaps.push(`${p.name}'s current role is not recorded.`);
    const title = m.title || 'Meeting'; const head = p && title.includes(p.name) ? `${title} (${p.title || 'role not recorded'}${p.organisation ? ', ' + p.organisation : ''}).` : `${title} with ${who}.`;
    return {headline: `${head} ${why}`.trim(), key_facts: key.slice(0, 6), history, in_the_news: inNews, open_items: open.slice(0, 6), talking_points: talk.slice(0, 5), watch_outs: watch.slice(0, 4), gaps: gaps.slice(0, 3)};
  }

  /* CRM updates after a note */
  function crm(s){
    const note = quoted(s, 'Note \\([^)]*\\):'), type = (s.match(/Note \((\w+)/) || [])[1] || '';

    const out = [];
    if (person && ['Cold', 'No contact yet'].includes(person.strength) && /Meeting|Call/.test(type)) out.push({target: 'person', field: 'strength', value: 'Warm', reason: `The note records a ${lc(type)} with them, so the relationship is no longer ${lc(person.strength)}.`});
    const promo = note.match(/promot\w* to ([A-Z][\w &]+?)[.,;]/);
    if (person && promo) out.push({target: 'person', field: 'title', value: promo[1].trim(), reason: 'The note says they were promoted.'});
    return out;
  }

  /* Ask Claude: request -> search criteria */
  function criteria(s){
    const q = quoted(s, 'Request:'), ql = REG(q);
    const vocab = {}; ['sectors', 'verticals', 'geos', 'countries', 'tickets', 'stages', 'capital', 'types'].forEach(k => { const m = s.match(new RegExp('^' + k + ': (\\[.*\\])$', 'm')); try { vocab[k] = m ? JSON.parse(m[1]) : []; } catch { vocab[k] = []; } });
    const pickV = k => vocab[k].filter(v => v.length > 3 && (k === 'types' || k === 'stages' || k === 'countries' ? ql.includes(lc(v)) : hit(ql, v)));
    const out = {sectors: pickV('sectors'), verticals: pickV('verticals'), geos: pickV('geos'), countries: pickV('countries'), tickets: [], stages: pickV('stages'), capital: pickV('capital'), types: pickV('types'), size_musd: null, keywords: [], summary: ''};
    const reg = ql.match(/\b(east|west|north|southern|central) africa/); if (reg) { const g = 'Africa – ' + reg[1][0].toUpperCase() + reg[1].slice(1); if (vocab.geos.includes(g)) out.geos.push(g); }
    if (/gulf|middle east|saudi|uae/.test(ql) && vocab.geos.includes('Middle East')) out.geos.push('Middle East');
    if (/payment/.test(ql)) ['Payments', 'B2B Payments', 'Embedded Finance'].forEach(v => vocab.verticals.includes(v) && out.verticals.push(v));
    if (/lend|credit|loan/.test(ql)) ['Digital Lending', 'Credit Infrastructure'].forEach(v => vocab.verticals.includes(v) && out.verticals.push(v));
    if (out.verticals.some(v => ['Payments', 'B2B Payments', 'Embedded Finance', 'Digital Lending', 'Credit Infrastructure', 'Remittances', 'InsurTech'].includes(v)) && vocab.sectors.includes('Fintech')) out.sectors.push('Fintech');
    const amt = q.match(/(?:US\$|\$)\s?(\d+(?:\.\d+)?)\s?(m|bn)/i); if (amt) out.size_musd = +amt[1] * (lc(amt[2]) === 'bn' ? 1000 : 1);
    if (/buyer|acquir|exit|sale/.test(ql)) out.types.push(...['Strategic / Corporate', 'Growth Equity / PE', 'Bank', 'Corporate VC'].filter(t => vocab.types.includes(t)));
    else if (/\blps?\b|limited partner|fund ?raising/.test(ql)) out.types.push(...['DFI', 'Family Office', 'Fund of Funds'].filter(t => vocab.types.includes(t)));
    else if (/co-?invest|syndicate|investor/.test(ql)) out.types.push(...['Venture Capital', 'Corporate VC', 'Private Equity', 'Growth Equity / PE', 'DFI'].filter(t => vocab.types.includes(t)));
    Object.keys(out).forEach(k => Array.isArray(out[k]) && (out[k] = uniq(out[k])));
    out.summary = words(q.charAt(0).toUpperCase() + q.slice(1), 22);
    return out;
  }

  /* Ask Claude: rate the shortlist */
  function rate(s){
    const q = quoted(s, 'for this request:'), ql = REG(q);
    const list = arr(jsonAfter(s, 'Institutions:', '\nReply with'));
    const buyers = /buyer|acquir|exit|sale/.test(ql);
    const scored = list.map((p, i) => {
      const reasons = [], evidence = [], unknowns = [], red = [];
      const hits = k => arr(p[k]).filter(v => hit(ql, v));
      const vh = hits('verticals'), ch = hits('countries'), sh = hits('stages'), sech = hits('sectors'), gh = hits('geos');
      if (vh.length) reasons.push(`Invests in ${vh.join(' and ')}`);
      else if (sech.length) reasons.push(`Invests in ${sech.join(' and ')}`);
      else if (arr(p.sectors).length) reasons.push(`Sector focus: ${arr(p.sectors).slice(0, 2).join(', ')}`);
      if (ch.length) reasons.push(`Active in ${ch.join(', ')}`);
      else if (gh.length) reasons.push(`Covers ${gh.join(', ')}`);
      else if (arr(p.geos).length) reasons.push(`Covers ${arr(p.geos).slice(0, 2).join(', ')}`);
      if (sh.length) reasons.push(`Does ${sh.join(' and ')} rounds`);
      const cheque = p.cheque || p.ticket;
      if (cheque && cheque !== 'unknown') evidence.push(`Cheque size ${cheque}`); else unknowns.push('Cheque size not recorded');
      if (p.deals_with_us) evidence.push(`Co-invested with us on ${p.deals_with_us} deal${p.deals_with_us > 1 ? 's' : ''}`);
      if (p.lead_or_follow) evidence.push(p.lead_or_follow === 'Lead' ? 'Usually leads rounds' : p.lead_or_follow === 'Both' ? 'Leads or follows' : 'Usually follows');
      if (arr(p.portfolio).length) evidence.push(`Portfolio includes ${arr(p.portfolio).slice(0, 3).join(', ')}`);
      if (buyers) { if (p.acquisition_appetite) reasons.push(`Acquisition appetite: ${p.acquisition_appetite}`); if (arr(p.acquisition_history)[0]) evidence.push(arr(p.acquisition_history)[0]); else unknowns.push('No acquisitions recorded'); }
      if (!arr(p.recent_notes).length) unknowns.push('No recent conversation logged'); else evidence.push('Recent note: ' + words(arr(p.recent_notes)[0], 14));
      if (!p.fund_musd && !buyers) unknowns.push('Current fund size unknown');
      if (['Track', 'Maybe', 'No'].includes(p.ranking)) red.push(`Ranked "${p.ranking}" internally`);
      if (buyers && p.acquisition_appetite === 'Low') red.push('Low appetite for acquisitions');
      const sc = vh.length * 2 + sech.length * 1.5 + gh.length + ch.length * 1.5 + sh.length + (p.deals_with_us ? 1 : 0) + (cheque && cheque !== 'unknown' ? .5 : 0) + (buyers && p.acquisition_appetite === 'High' ? 2 : 0) - red.length - i * .05;
      return {id: p.id, sc, reasons: reasons.slice(0, 3), evidence: evidence.slice(0, 3), unknowns: unknowns.slice(0, 2), red_flags: red};
    }).sort((a, b) => b.sc - a.sc);
    return scored.slice(0, 14).map((r, i) => ({id: r.id, rating: i < 4 ? 'Strong' : i < 10 ? 'Possible' : 'Weak', reasons: r.reasons, evidence: r.evidence, unknowns: r.unknowns, red_flags: r.red_flags}));
  }

  /* Sourcing: second opinion and pre-screen memo */
  function candFit(f){
    const t = f.thesis || {}, lr = f.last_round || {};
    const fit = [], concerns = [], unknowns = [];
    if (arr(t.verticals).includes(f.sub_sector)) fit.push(`${f.sub_sector} is a core vertical for "${t.title}"`); else concerns.push(`${f.sub_sector} sits outside the thesis's core verticals`);
    if (arr(t.countries).includes(f.country)) fit.push(`${f.country} is a focus market`); else concerns.push(`${f.country} is not a focus market`);
    if (arr(t.stages).includes(f.stage)) fit.push(`${f.stage} is a target stage`); else concerns.push(`${f.stage} is outside the target stages`);
    const g = f.headcount_growth_12m_pct;
    if (g != null) (g >= 25 ? fit : g < 0 ? concerns : unknowns).push(g >= 25 ? `Headcount up ${g}% in 12 months` : g < 0 ? `Headcount down ${Math.abs(g)}% in 12 months` : `Headcount growth is modest (${g}%)`);
    const second = arr(f.founders).some(x => /second-time|exit/.test(x.background || ''));
    if (second) fit.push('Includes a founder with a previous exit');
    if (!arr(f.signals).length) concerns.push('No new signals in the last 90 days');
    unknowns.push('Unit economics and loss rates', 'Who is leading the next round');
    if (!lr.investors || !lr.investors.length) unknowns.push('Current investors');
    const score = Math.max(20, Math.min(95, 45 + fit.length * 9 - concerns.length * 7));
    return {fit, concerns, unknowns, score, rating: score >= 72 ? 'Strong' : score >= 55 ? 'Possible' : 'Weak'};
  }
  function candReview(s){
    const f = jsonAfter(s, 'FACTS:', '\nReply with') || {}; const c = candFit(f);
    return {rating: c.rating, suggested_score: c.score, summary: `${f.company} is a ${f.stage} ${lcFirst(f.sub_sector)} company in ${f.country}; ${f.traction ? 'reported traction: ' + f.traction : 'traction not disclosed'}. ${c.rating === 'Strong' ? 'A good fit worth a first call.' : c.rating === 'Possible' ? 'A partial fit; worth tracking or a light first call.' : 'A weak fit for this thesis.'}`, strengths: c.fit.slice(0, 4), concerns: c.concerns.slice(0, 4), unknowns: c.unknowns.slice(0, 3)};
  }
  function memo(s){
    const f = jsonAfter(s, 'FACTS:', '\nReply with') || {}; const c = candFit(f), lr = f.last_round || {}, t = f.thesis || {};
    const founders = arr(f.founders).map(x => `${x.name} (${x.role}, ${x.background})`).join('; ');
    return {
      snapshot: `${f.company} (${f.country}, founded ${f.founded || 'n/a'}) — ${lcFirst(f.what_they_do || '').replace(/\.$/, '')}. ${f.stage}; ${f.total_raised_musd ? 'US$' + f.total_raised_musd + 'm raised to date' : 'total raised not disclosed'}. Team: ${founders || 'not recorded'}.`,
      why_now: lr.date ? `Last raised a US$${lr.amount}m ${lr.type} on ${fmt(lr.date)}${arr(lr.investors).length ? ' from ' + lr.investors.join(' and ') : ''}; a next round is plausible within 12–18 months.` : 'Timing of the next round is not known.',
      thesis_fit: c.fit.slice(0, 3).concat(c.fit.length < 3 ? [`Assessed against "${t.title}"`] : []).slice(0, 3),
      traction: [f.traction, f.headcount ? `${f.headcount} staff${f.headcount_growth_12m_pct != null ? ', ' + (f.headcount_growth_12m_pct >= 0 ? '+' : '') + f.headcount_growth_12m_pct + '% in 12 months' : ''}` : null, arr(f.signals)[0] ? `${fmt(f.signals[0].date)}: ${f.signals[0].text}` : null].filter(Boolean),
      risks: c.concerns.concat(['Regulatory and licensing exposure in each market', 'Concentration in a small number of partners or corridors']).slice(0, 4),
      questions: ['What are loss rates or take rates by cohort?', 'What are the top three customers or partners as a share of volume?', 'How much runway is left, and what is the plan for the next round?', 'Which licences are held, and which are pending?', 'How is the founding team split across product, risk and growth?'],
      recommendation: c.rating === 'Strong' ? 'Take a first call: strong thesis fit; test unit economics early.' : c.rating === 'Possible' ? 'Watch: partial fit; revisit after the next funding or traction update.' : 'Pass for now: weak fit with this thesis.'};
  }

  /* Origination (advisory desk): pitch angle and pitch note */
  function origFacts(s){ return jsonAfter(s, 'FACTS:', '\nReply with') || {}; }
  function origRead(f){
    const trig = arr(f.triggers), way = f.way_in || {level: 'None'}, th = f.theme || {};
    const mand = f.likely_mandate || 'Sell-side';
    const fit = [];
    if (arr(th.sub_sectors).includes(f.sub_sector)) fit.push(`${f.sub_sector} is core to "${th.title}"`);
    if (arr(th.countries).includes(f.country)) fit.push(`${f.country} is a focus market`);
    const [lo, hi] = arr(th.deal_size_musd); const ds = f.est_deal_size_musd;
    const inRange = ds && lo != null && ds >= lo && ds <= hi;
    const score = f.model_score ? f.model_score.score : 60;
    const adj = (trig.length ? 4 : -8) + (way.level === 'None' ? -10 : way.level === 'Direct' ? 4 : 0) + (inRange ? 2 : -6);
    const sug = Math.max(15, Math.min(95, score + adj));

  }
  const money_ = x => x == null ? 'an undisclosed amount' : 'US$' + (x >= 10 ? Math.round(x) : Math.round(x * 10) / 10) + 'm';
  function pitchAngle(s){
    const f = origFacts(s), r = origRead(f), t0 = r.trig[0];
    const cps = arr(f.possible_counterparties_in_crm).slice(0, 4);
    const conf = arr(f.live_deals_in_same_sector).slice(0, 2).map(d => `${d.deal}${d.client ? ' for ' + d.client : ''} is in the same sector; check it isn't a competitor or a likely bidder`);
    const who = r.way.level === 'None' ? [] : [`${r.way.who}${r.way.note ? ' (' + r.way.note + ')' : ''}`];
    return {rating: r.rating, suggested_score: r.sug, mandate: r.mand,
      why_now: t0 ? `${t0.text}.` + (f.ownership === 'PE-backed' && f.years_held_by_owner >= 4 ? ' The owner is at the point in its hold where exits are usually planned.' : '') : `No clear trigger yet; the case rests on ${lcFirst(f.ownership || 'the ownership').toLowerCase()} and the sector backdrop.`,
      angle: `Lead with a ${r.mand.toLowerCase()} conversation on ${f.company}: a ${money_(r.ds)} ${r.mand === 'Debt raise' ? 'facility' : 'transaction'} sized to its ${money_(f.revenue_musd)} revenue. ${who.length ? 'Open through ' + r.way.who.split(',')[0] + ' rather than a cold approach.' : 'Find a warm introduction before approaching the owner.'}`,
      who_we_know: who.length ? who : [],
      counterparties: cps.map(c => `${c.name}: ${c.type}${c.ticket ? ', tickets ' + c.ticket : ''}${c.hq ? ', ' + c.hq : ''}`),
      conflicts: conf,
      unknowns: ['Up-to-date financials and debt terms', 'Whether another adviser is already engaged', r.way.level === 'None' ? 'Who could introduce us to the owner' : "The owner's own timetable"].slice(0, 3)};
  }
  function pitchNote(s){
    const f = origFacts(s), r = origRead(f), t0 = r.trig[0];
    const cps = arr(f.possible_counterparties_in_crm).slice(0, 5);
    const fee = f.est_fee_musd;
    return {
      snapshot: `${f.company} (${f.country}${f.founded ? ', founded ' + f.founded : ''}): ${lcFirst(f.what_they_do || '').replace(/\.$/, '')}. ${f.ownership}${f.owner ? ' (' + f.owner + ')' : ''}; revenue about ${money_(f.revenue_musd)}${f.employees ? ' and ' + f.employees + ' staff' : ''}.`,
      why_now: t0 ? `${t0.text}.` : 'No specific trigger recorded; timing would need to be tested in a first conversation.',
      mandate_hypothesis: `A ${r.mand.toLowerCase()} of about ${money_(r.ds)}${r.inRange ? ', within the theme range' : ''}.${r.fit.length ? ' ' + r.fit.join('; ') + '.' : ''}`,
      counterparties: cps.length ? cps.map(c => `${c.name} (${c.type}): ${c.ticket ? 'writes ' + c.ticket + '; ' : ''}active in the sector`) : ['No obvious counterparties in the CRM yet; build a list before pitching.'],
      approach: [r.way.level === 'None' ? 'Find a warm introduction to the owner or chairman' : `Open through ${r.way.who.split(',')[0]}`, `Share a short view on ${r.mand === 'Sell-side' ? 'valuation and likely buyers' : r.mand === 'Debt raise' ? 'refinancing options and lenders' : 'investor appetite and structure'}`, 'Propose a scoping meeting with management', 'Agree next steps and a fee letter'],
      fee_estimate: fee ? `About ${money_(fee)} on a ${r.mand === 'Debt raise' ? '1%' : r.mand === 'Capital raise' ? '2.5%' : r.mand === 'Buy-side' ? '1.5%' : '2%'} success fee, before any retainer.` : 'Not estimated: deal size unknown.',
      risks: ['Owner may not be ready to transact', 'Another adviser may already be close to the company', arr(f.live_deals_in_same_sector).length ? 'Possible conflict with a live mandate in the same sector' : 'Limited information until management engages', r.inRange ? 'Valuation expectations may run ahead of the market' : 'Deal size sits outside the usual range for this theme'],

  const HANDLERS = [[/working out the pitch angle/, pitchAngle], [/one-page pitch note/, pitchNote], [/preparing (an investor|a banker)/, prep], [/keep a deal desk CRM/, crm], [/^Turn this request/, criteria], [/screening institutions/, rate], [/second opinion on a sourced company/, candReview], [/pre-screen memo/, memo], [/^Investment idea/, idea]];

  /* Demo banner and automatic sample data */

    b.setAttribute('role', 'note');
    const links = (window.__DEMO_LINKS || [{href: '../index.html', label: '← Portfolio'}]).map(l => `<a href="${l.href}" class="db-back"${/^https?:/.test(l.href) ? ' target="_blank" rel="noopener"' : ''}>${l.label}</a>`).join('');
    b.innerHTML = `${links}<span><b>Interactive demo.</b> Every name and figure is made up. Your changes stay in this tab and reset when you reload. Claude features show example answers built from the demo data.</span>`;
    const st = document.createElement('style');
    st.textContent = `#demo-banner{position:sticky;top:0;z-index:9999;display:flex;gap:14px;align-items:center;padding:7px 16px;background:#1f2a24;color:#e9efe9;font:13px/1.4 "IBM Plex Sans",system-ui,sans-serif}#demo-banner b{color:#fff}#demo-banner .db-back{color:#9fd8b6;text-decoration:none;font-weight:600;white-space:nowrap}#demo-banner .db-back:hover{text-decoration:underline}@media(max-width:700px){#demo-banner{font-size:12px}}`;
    document.head.appendChild(st); document.body.insertBefore(b, document.body.firstChild);
  }
  async function autoSeed(){
    for (let i = 0; i < 200; i++) {
      await sleep(50);
      if (typeof seedDemo === 'function' && typeof ST !== 'undefined' && ST.db && ST.ready) {
        if (![...store.keys()].some(k => k.startsWith('desk/'))) await seedDemo();
        return;
      }
    }
  }
  document.addEventListener('DOMContentLoaded', () => { banner(); autoSeed(); });
})();

const SHARDS = {team:1, firms:4, companies:2, holdings:1, people:4, deals:1, opps:2, dist:2, notes:4, tasks:2, catchup:2, news:2, sources:1, proposals:1, lessons:1, meta:1, theses:1, cands:8};
const COLLS = Object.keys(SHARDS);
const D = {}; COLLS.forEach(c => D[c] = {});
const CHANGES = [];
const ST = { db:null, user:null, sample:null, downloads:null, ready:false, loadErr:null, shardDocs:new Set(), canWrite:true, isOwner:false, canEdit:false, changesLoaded:false };
const shardOf = (coll, id) => coll + '-' + (hashId(id) % SHARDS[coll]);
const rec = (coll, id) => (id && D[coll][id]) || null;

function ingestShards(docs){
  COLLS.forEach(c => D[c] = {});
  ST.shardDocs = new Set();
  for (const d of docs) {
    ST.shardDocs.add(d.id);
    const coll = d.id.replace(/-\d+$/, '');
    if (!D[coll]) continue;
    const r = (d.data() || {}).r || {};
    for (const [id, v] of Object.entries(r)) if (v && typeof v === 'object' && !v._del) { const o = Object.assign({id}, v); delete o._del; D[coll][id] = o; }
  }
}

const queues = {};
function enqueue(key, fn){ const p = (queues[key] || Promise.resolve()).then(fn); queues[key] = p.catch(() => {}); return p; }
async function writeShardPatch(shardId, patch){
  return enqueue(shardId, async () => {
    const ref = ST.db.doc('desk/' + shardId);
    if (!ST.shardDocs.has(shardId)) {
      const snap = await ref.get();
      if (!snap.exists) { await ref.set({r: patch}); ST.shardDocs.add(shardId); return; }
      ST.shardDocs.add(shardId);
    }
    await ref.update({r: patch});
  });
}
function stripId(r){ if (!r) return r; const o = clone(r); delete o.id; return o; }
async function persist(items){
  const byShard = {};
  for (const {coll, id, after} of items) {
    const sh = shardOf(coll, id);
    (byShard[sh] = byShard[sh] || {})[id] = after ? Object.assign(stripId(after), {_del: null}) : {_del: true};
  }
  // When a record is rewritten, fields that disappeared must be nulled so the merge clears them.
  for (const {coll, id, before, after} of items) if (before && after) for (const k of Object.keys(before)) if (!(k in after) && k !== 'id') byShard[shardOf(coll, id)][id][k] = null;
  await Promise.all(Object.entries(byShard).map(([sh, p]) => writeShardPatch(sh, p)));
}
function applyLocal(items){
  for (const {coll, id, after} of items) { if (after) D[coll][id] = Object.assign({id}, clone(after)); else delete D[coll][id]; }
}
const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
function diffItem(coll, id, before, after){
  if (!before && !after) return null;
  if (!before) return {coll, id, op:'create', after: stripId(after)};
  if (!after) return {coll, id, op:'delete', before: stripId(before)};
  const keys = uniq([...Object.keys(before), ...Object.keys(after)]).filter(k => k !== 'id');
  const b = {}, a = {}; let n = 0;
  for (const k of keys) if (!same(before[k], after[k])) { b[k] = before[k] ?? null; a[k] = after[k] ?? null; n++; }
  return n ? {coll, id, op:'update', before:b, after:a} : null;
}

/** Apply one user action. writes: [{coll,id,rec|null}] (rec = full new record) */
async function act(label, writes, opts = {}){
  if (!ST.canWrite) { toast('You have view-only access to this desk.', true); return false; }
  const items = [], log = [];
  for (const w of writes) {
    const before = clone(D[w.coll][w.id] || null);
    const after = w.rec ? Object.assign(clone(w.rec), {id: w.id}) : null;
    const d = diffItem(w.coll, w.id, before, after);
    if (!d) continue;
    items.push({coll:w.coll, id:w.id, before, after}); log.push(d);
  }
  if (!items.length) return true;
  applyLocal(items); scheduleRender();
  const ch = {ts: Date.now(), by: me(), source: opts.source || 'manual', label, items: log, undone: false};
  const chId = uid('c');
  CHANGES.unshift(Object.assign({id: chId}, ch)); updateUndoUi();
  try {
    await persist(items);
    if (!opts.nolog) await ST.db.doc('changes/' + chId).set(ch);
  } catch (e) { handleWriteError(e); return false; }
  if (opts.toast !== false) toast(opts.toast || label, false, opts.undoable === false ? null : {label:'Undo', fn: () => undoAction(chId)});
  return true;
}
function handleWriteError(e){
  console.error(e);
  if (e && e.code === 'invalid_argument') { ST.canWrite = false; toast('This change was not saved: you have view-only access.', true); }
  else if (e && e.code === 'quota_exceeded') toast('The demo database is full. Use Settings › Demo data › Reset.', true);
  else toast('Could not save. Check your connection and try again.', true);
}
/* Reverse or re-apply a logged change. */
function invertItems(ch, redo){
  const writes = [];
  for (const it of ch.items) {
    const cur = D[it.coll][it.id] || null;
    if (!redo) {
      if (it.op === 'create') writes.push({coll:it.coll, id:it.id, before:cur, after:null});
      else if (it.op === 'delete') writes.push({coll:it.coll, id:it.id, before:cur, after:Object.assign({id:it.id}, clone(it.before))});
      else if (cur) writes.push({coll:it.coll, id:it.id, before:cur, after:Object.assign(clone(cur), clone(it.before))});
    } else {
      if (it.op === 'create') writes.push({coll:it.coll, id:it.id, before:cur, after:Object.assign({id:it.id}, clone(it.after))});
      else if (it.op === 'delete') writes.push({coll:it.coll, id:it.id, before:cur, after:null});
      else if (cur) writes.push({coll:it.coll, id:it.id, before:cur, after:Object.assign(clone(cur), clone(it.after))});
    }
  }
  return writes.filter(w => !same(w.before, w.after));
}
async function revertChange(ch, mode){
  const writes = invertItems(ch, mode === 'redo');
  applyLocal(writes); scheduleRender();
  const patch = mode === 'redo' ? {undone:false, redoneAt:Date.now()} : mode === 'reject' ? {undone:true, rejected:true, rejectedBy:me(), undoneAt:Date.now()} : {undone:true, undoneAt:Date.now(), undoneBy:me()};
  Object.assign(ch, patch); updateUndoUi();
  try { await persist(writes); await ST.db.doc('changes/' + ch.id).update(patch); }
  catch (e) { handleWriteError(e); }
}
const DAY_MS = 864e5;
function undoCandidate(){ const t = Date.now() - DAY_MS; return CHANGES.filter(c => c.by === me() && c.ts > t && !c.undone && c.source !== 'seed').sort((a, b) => b.ts - a.ts)[0] || null; }
function redoCandidate(){
  const t = Date.now() - DAY_MS;
  const lastDone = CHANGES.filter(c => c.by === me() && !c.undone && !c.undoneAt).reduce((m, c) => Math.max(m, c.ts), 0);
  return CHANGES.filter(c => c.by === me() && c.undone && !c.rejected && c.undoneBy === me() && (c.undoneAt || 0) > t && (c.undoneAt || 0) > lastDone).sort((a, b) => b.undoneAt - a.undoneAt)[0] || null;
}
async function undoAction(id){
  const ch = id ? CHANGES.find(c => c.id === id) : undoCandidate();
  if (!ch) { toast('Nothing to undo from the last 24 hours.'); return; }
  if (ch.undone) { toast('That change was already undone.'); return; }
  await revertChange(ch, 'undo'); toast('Undone: ' + ch.label, false, {label:'Redo', fn: redoAction});
}
async function redoAction(){
  const ch = redoCandidate();
  if (!ch) { toast('Nothing to redo.'); return; }
  await revertChange(ch, 'redo'); toast('Redone: ' + ch.label);
}

function toast(msg, err, action){

/* Modals (stackable) */
const MODALS = [];
function openModal({title, body, foot, size, onMount, onClose}){
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="modal ${size || ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h3>${title}</h3><button class="btn ghost iconbtn x" data-close aria-label="Close">✕</button></div><div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div>`;
  document.body.appendChild(scrim);
  const m = {el: scrim.firstElementChild, scrim, onClose};
  MODALS.push(m); UI.editing = true;
  scrim.addEventListener('mousedown', e => { if (e.target === scrim) m.downOnScrim = true; });
  scrim.addEventListener('click', e => { if (e.target === scrim && m.downOnScrim) closeModal(m); m.downOnScrim = false; if (e.target.closest('[data-close]')) closeModal(m); });
  onMount && onMount(m.el, m);
  const f = m.el.querySelector('.mb input:not([type=checkbox]):not([type=date]), .mb textarea, .mb [contenteditable]'); if (f && !size?.includes('nofocus')) setTimeout(() => f.focus(), 30);
  return m;
}
function closeModal(m){
  m = m || MODALS[MODALS.length - 1]; if (!m) return;
  const i = MODALS.indexOf(m); if (i >= 0) MODALS.splice(i, 1);
  m.scrim.remove(); closePop(); m.onClose && m.onClose();
  if (!MODALS.length) flushBlocked();
}

/* Popovers */
let POP = null;
function openPop(anchor, html, {cls = '', onMount, align} = {}){
  closePop();
  const el = document.createElement('div'); el.className = 'pop ' + cls; el.innerHTML = html;
  document.body.appendChild(el);
  POP = {el, anchor, align};
  placePop();
  onMount && onMount(el);
  return el;
}
function placePop(){
  if (!POP) return; const {el, anchor, align} = POP;
  if (!anchor.isConnected) { closePop(); return; }
  const r = anchor.getBoundingClientRect(); const w = el.offsetWidth, h = el.offsetHeight;
  let x = align === 'right' ? r.right - w : r.left; let y = r.bottom + 4;
  if (x + w > innerWidth - 8) x = innerWidth - w - 8; if (x < 8) x = 8;
  if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 4);
  el.style.left = x + 'px'; el.style.top = y + 'px';
}
function closePop(){ if (POP) { POP.el.remove(); POP = null; } }
document.addEventListener('mousedown', e => { if (POP && !POP.el.contains(e.target) && !POP.anchor.contains(e.target)) closePop(); });
window.addEventListener('resize', closePop);
document.addEventListener('scroll', e => { if (POP && !POP.el.contains(e.target)) placePop(); }, true);

/* Multi-select registry. Rendered as <button class="ms" data-ms="key">. */
const MS = {};
function msButton(key, cfg){
  MS[key] = cfg;
  const sel = arr(cfg.get());
  const on = sel.length > 0;
  let label = cfg.label;
  if (cfg.form) label = on ? sel.map(v => (cfg.options().find(o => o.v === v) || {l: v}).l).join(', ') : (cfg.placeholder || 'Choose…');
  else if (on) label += cfg.single ? ': ' + ((cfg.options().find(o => o.v === sel[0]) || {l: sel[0]}).l) : ' (' + sel.length + ')';
  return `<button type="button" class="ms ${on && !cfg.form ? 'on' : ''}" data-ms="${esc(key)}" id="ms-${esc(key)}">${esc(label)}</button>`;
}
function openMs(btn){
  const key = btn.dataset.ms, cfg = MS[key]; if (!cfg) return;
  let q = '';
  const draw = el => {
    const sel = arr(cfg.get());
    const ql = q.toLowerCase();
    let opts = cfg.options().filter(o => !ql || (o.l + ' ' + (o.g || '')).toLowerCase().includes(ql));
    const selOpts = opts.filter(o => sel.includes(o.v)), rest = opts.filter(o => !sel.includes(o.v));
    let html = '';
    if (selOpts.length && !cfg.single) html += `<div class="ms-grp">Selected</div>` + selOpts.map(o => row(o, true)).join('');
    let lastG = null;
    for (const o of (cfg.single ? opts : rest)) { if (o.g && o.g !== lastG) { html += `<div class="ms-grp">${esc(o.g)}</div>`; lastG = o.g; } html += row(o, sel.includes(o.v)); }
    if (!opts.length) html += `<div class="ph">No matches</div>`;
    el.querySelector('.ms-list').innerHTML = html;
    function row(o, c){ return `<label><input type="${cfg.single ? 'radio' : 'checkbox'}" name="ms-${esc(key)}" value="${esc(o.v)}" ${c ? 'checked' : ''}> <span>${esc(o.l)}</span>${o.n != null ? `<span class="faint" style="margin-left:auto">${o.n}</span>` : ''}</label>`; }
  };
  openPop(btn, `<div class="ms-search"><input type="search" placeholder="Search…" aria-label="Search options"></div><div class="ms-list"></div><div class="ms-foot">${cfg.addNew ? `<button class="btn sm ghost ms-add" data-add>+ Add new</button>` : '<span></span>'}<button class="btn sm ghost" data-clear>Clear</button></div>`, {cls: 'ms-pop', onMount: el => {
    draw(el);
    const inp = el.querySelector('input'); setTimeout(() => inp.focus(), 10);
    inp.addEventListener('input', () => { q = inp.value; draw(el); });
    el.addEventListener('change', e => {
      if (!e.target.matches('input[type=checkbox], input[type=radio]')) return;
      const v = e.target.value; let sel = arr(cfg.get()).slice();
      if (cfg.single) sel = e.target.checked ? [v] : []; else if (e.target.checked) sel.push(v); else sel = sel.filter(x => x !== v);

      if (cfg.single) { closePop(); refreshMs(key); return; }
      draw(el); refreshMs(key);
    });
    el.querySelector('[data-clear]').onclick = () => { cfg.set(cfg.single ? '' : []); draw(el); refreshMs(key); };
    const add = el.querySelector('[data-add]'); if (add) add.onclick = () => { closePop(); cfg.addNew(q); };
  }});
}

/* Sortable tables */
const SORT = storeGet('sort', {});
function table({id, cols, rows, empty, rowCls, defSort}){
  const s = SORT[id] || defSort || {};
  const col = cols.find(c => c.key === s.key && c.sort);
  if (col) {
    const dir = s.dir === 'desc' ? -1 : 1;
    rows = rows.slice().sort((a, b) => { const x = col.sort(a), y = col.sort(b); if (x == null || x === '') return 1; if (y == null || y === '') return -1; return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), undefined, {numeric: true})) * dir; });

/* "Last update" bookkeeping per collection */
function touchPatch(coll, r, patch){
  if (coll === 'opps' && ['details','nextStep','relevance','status','nextDue'].some(k => k in patch)) patch.lastUpdate = today();
  if (coll === 'dist' && ['status','dataRoom','feedback','next'].some(k => k in patch)) patch.lastUpdate = today();
  if (coll === 'deals' && ('nextStep' in patch) && patch.nextStep !== r.nextStep) patch.nextSet = today();
  return patch;
}
function recLabel(coll, r){
  if (!r) return '';
  switch (coll) {
    case 'deals': return dealName(r); case 'opps': return oppName(r); case 'people': return r.name; case 'firms': case 'companies': case 'team': case 'cands': case 'theses': return r.name || r.title;
    case 'dist': return (rec('firms', r.firmId)?.name || 'row') + ' (' + dealName(rec('deals', r.dealId)) + ')';
    case 'tasks': return '“' + r.title + '”'; case 'notes': return 'note'; case 'news': return '“' + (r.title || '').slice(0, 50) + '”';
    default: return coll;
  }
}

}

function barChart(title, pairs, color){

}
function trendChart(title, pairs){
  const W = 520, H = 170, P = 26, max = Math.max(1, ...pairs.map(p => p[1]));
  const bw = (W - P * 2) / Math.max(1, pairs.length);
  const ticks = [0, Math.ceil(max / 2), max];
  return `<div class="chart"><h4>${esc(title)}</h4><svg class="trend" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}">
  ${ticks.map(t => { const y = H - 20 - (t / max) * (H - 40); return `<line x1="${P}" x2="${W - 6}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${P - 6}" y="${y + 3}" text-anchor="end">${t}</text>`; }).join('')}
  ${pairs.map(([l, v], i) => { const h = (v / max) * (H - 40); const x = P + i * bw + bw * .18; return `<rect x="${x}" y="${H - 20 - h}" width="${bw * .64}" height="${h}" rx="2" fill="var(--accent)" opacity="${i === pairs.length - 1 ? 1 : .55}"><title>${esc(l)}: ${v}</title></rect><text x="${x + bw * .32}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>${v ? `<text x="${x + bw * .32}" y="${H - 24 - h}" text-anchor="middle">${v}</text>` : ''}`; }).join('')}
  </svg></div>`;
}
const countBy = (list, fn) => { const m = {}; for (const x of list) for (const k of arr(fn(x))) m[k] = (m[k] || 0) + 1; return m; };
const pairsFrom = (m, order) => (order || Object.keys(m).sort((a, b) => m[b] - m[a])).filter(k => m[k]).map(k => [k, m[k]]);
function monthTrend(list, fn, n){
  const out = []; const d = new Date(); d.setDate(1);
  for (let i = n - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); const key = x.getFullYear() + '-' + pad(x.getMonth() + 1); out.push([MON[x.getMonth()], list.filter(r => String(fn(r) || '').slice(0, 7) === key).length]); }

}

/* ============================================================
   App shell: boot, header, tabs, routing, events, Settings, Undo
   ============================================================ */
const TABS = [
  {id:'summary', label:'Summary'},
  {id:'catchup', label:'Catch-up'},
  {id:'relationships', label:'Relationship management'},
  {id:'sourcing', label:'Origination', hash:'origination'},
  {id:'opportunities', label:'Pipeline', hash:'pipeline'},
  {id:'pipeline', label:'Live deals', hash:'live-deals'},
  {id:'crm', label:'CRM'},
  {id:'conversations', label:'Recent conversations'},
  {id:'distribution', label:'Distribution'},
  {id:'news', label:'News'},
];
const VIEWS = {};
const hashOf = id => (TABS.find(t => t.id === id) || {}).hash || id;
const tabOfHash = h => (TABS.find(t => '#' + (t.hash || t.id) === h) || {}).id;
const R = { tab: tabOfHash(location.hash) || storeGet('tab', 'summary'), rec: null, back: [] };
const FS = storeGet('filters', {});
const fget = (tab, key, def) => (FS[tab] && FS[tab][key] !== undefined) ? FS[tab][key] : def;
function fset(tab, key, val, noRender){ FS[tab] = FS[tab] || {}; FS[tab][key] = val; storeSet('filters', FS); if (!noRender) renderAll(); }
function freset(tab, keep){ const k = {}; (keep || []).forEach(x => { if (FS[tab] && x in FS[tab]) k[x] = FS[tab][x]; }); FS[tab] = k; storeSet('filters', FS); renderAll(); }
/* Multi-select filter bound to FS */
function fMs(tab, key, label, options, single){
  return msButton(tab + '-' + key, {label, options: typeof options === 'function' ? options : () => options, get: () => fget(tab, key, single ? '' : []), set: v => fset(tab, key, v, true), onChange: () => renderAll(), single});
}
const fIn = (tab, key, v) => { const sel = arr(fget(tab, key, [])); return !sel.length || arr(v).some(x => sel.includes(x)); };
function searchBox(tab, ph){ return `<label class="search"><span aria-hidden="true">⌕</span><input id="q-${tab}" data-q="${tab}" type="search" placeholder="${esc(ph || 'Search…')}" value="${esc(fget(tab, 'q', ''))}"></label>`; }

function go(tab, opts = {}){
  closePop();
  if (opts.filters) { FS[tab] = Object.assign(FS[tab] || {}, opts.filters); storeSet('filters', FS); }
  R.tab = tab; R.rec = null; R.back = []; storeSet('tab', tab);
  if (location.hash !== '#' + hashOf(tab)) history.replaceState(null, '', '#' + hashOf(tab));
  renderAll(); window.scrollTo(0, 0);
}
function openRecord(kind, id){
  closePop();
  if (kind === 'tab') return go(id);
  if (kind === 'dist') { const r = rec('dist', id); if (r) { fset('distribution', 'deal', r.dealId, true); go('distribution'); } return; }
  if (kind === 'opp') { const o = rec('opps', id); if (!o) return; if (o.kind !== 'idea') { if (o.companyId) kind = 'company', id = o.companyId; else return go('opportunities'); } else kind = 'idea'; }
  if (R.rec) R.back.push(R.rec);
  R.rec = {kind, id}; renderAll(); window.scrollTo(0, 0);
}
function goBack(){ R.rec = R.back.pop() || null; renderAll(); }
const link = (kind, id, text, cls = 'rowlink') => id ? `<a href="#" class="${cls}" data-open="${kind}:${id}">${esc(text || nameOf(kind, id) || 'Unknown')}</a>` : esc(text || '');

/* ---------------- counts for tab badges ---------------- */
function tabCounts(){
  const items = catchupItems(); const open = items.filter(i => i.state === 'open');
  const mine = open.filter(i => arr(i.owners).includes(me()));
  const t = today(), m0 = t.slice(0, 7);
  return {
    summary: {n: mine.length},
    catchup: {n: open.length, red: open.some(i => isOverdue(i.due))},
    relationships: {n: all('tasks').filter(x => x.kind === 'reminder' && !x.done && x.due && x.due.slice(0, 7) === m0).length},
    sourcing: {n: all('cands').filter(c => !c.hidden && c.status === 'new').length},
    opportunities: {n: all('opps').filter(o => ['New','Under review'].includes(o.status)).length},
    pipeline: {n: all('deals').filter(dealActive).length},
    crm: {n: all('firms').length + all('companies').length},
    conversations: {n: visibleNotes().filter(n => n.date >= addDays(t, -30)).length},
    distribution: {n: uniq(all('dist').map(r => r.dealId)).length},
    news: {n: all('news').filter(n => !n.dismissed && n.date >= addDays(t, -7)).length},
  };
}
const visibleNotes = () => all('notes').filter(n => !n.private || n.author === me());

/* ---------------- render ---------------- */
function renderAll(){
  const root = $('#app'); if (!root) return;
  const ae = document.activeElement; const fid = ae && ae.id && root.contains(ae) ? ae.id : null;
  const selS = fid && 'selectionStart' in ae ? ae.selectionStart : null;
  const sy = window.scrollY;
  root.innerHTML = renderShell();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { if (selS != null) el.setSelectionRange(selS, selS); } catch {} } }
  window.scrollTo(0, sy);
  updateUndoUi();
}
function renderShell(){
  if (!ST.ready) return mastHtml() + `<main><div class="loading">${ST.loadErr ? esc(ST.loadErr) : '<span class="spinner"></span>&nbsp; Loading the desk…'}</div></main>`;
  const empty = !all('team').length;
  if (empty) return mastHtml() + `<main>${emptyHtml()}</main>`;
  if (!rec('team', VIEW_AS)) { VIEW_AS = team()[0].id; storeSet('viewas', VIEW_AS); }
  const counts = tabCounts();
  const tabs = TABS.map(t => { const c = counts[t.id] || {}; return `<button class="tab ${R.tab === t.id && !R.rec ? 'on' : ''}" data-tab="${t.id}">${esc(t.label)} <span class="badge ${c.red ? 'red' : ''}">${c.n ?? ''}</span></button>`; }).join('');
  let body = '';
  try { body = R.rec ? renderRecord(R.rec) : VIEWS[R.tab](); }
  catch (e) { console.error(e); body = `<div class="banner">Something went wrong drawing this view (${esc(e.message)}). <button class="btn sm" data-tab="${R.tab}">Reload view</button></div>`; }
  return mastHtml() + `<nav class="tabrail" aria-label="Desk sections">${tabs}<span class="today">${esc(new Date().toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', year:'numeric'}))}</span></nav><main>${body}</main>`;
}
function mastHtml(){
  const opts = team().map(t => `<option value="${t.id}" ${t.id === VIEW_AS ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
  const pend = all('proposals').filter(p => p.owner === me() && p.state === 'pending').length;
  return `<header class="mast">
    <div class="brand"><h1>Deal Desk</h1><span class="sub">Business development · ${esc(BANK)}</span>
    <span class="demo-chip" title="Made-up data for demonstrations. Not a real pipeline.">Demo – sample data</span></div>
    <div class="mast-right">
      ${all('team').length ? `<label class="viewas" for="viewas">Viewing as <select id="viewas">${opts}</select></label>
      <button class="btn agent" data-act="emailScan" title="Review what the email scan found for you">✉ Email scan${pend ? ` <span class="badge" style="background:var(--agent);color:#fff">${pend}</span>` : ''}</button>
      <span class="seg" role="group" aria-label="Undo and redo"><button id="undoBtn" data-act="undo" title="Undo">↶ Undo</button><button id="redoBtn" data-act="redo" title="Redo">↷</button></span>
      <button class="btn iconbtn" data-act="settings" title="Settings" aria-label="Settings">⚙</button>` : ''}
    </div></header>`;
}
function emptyHtml(){
  const can = ST.isOwner || ST.canEdit;
  return `<div class="card" style="max-width:640px;margin:40px auto;padding:22px"><h2 style="font-size:26px;text-transform:uppercase">The demo desk is empty</h2>
  <p>This desk runs on made-up sample data: about 60 institutions, 40 companies, 150 contacts, 14 deals and their notes, tasks, distribution lists and news. The dates are set relative to the day you load it, so it always looks current.</p>
  ${can ? `<p><button class="btn primary" data-act="seed">Load sample data</button></p>` : `<p class="muted">Ask the owner of this desk to load the sample data.</p>`}</div>`;
}
function updateUndoUi(){
  const u = $('#undoBtn'), r = $('#redoBtn'); if (!u) return;
  const uc = undoCandidate(), rc = redoCandidate();
  u.disabled = !uc; r.disabled = !rc;
  u.title = uc ? `Undo: ${uc.label} (${ago(uc.ts)}) — Ctrl/Cmd+Z` : 'Nothing to undo from the last 24 hours';
  r.title = rc ? `Redo: ${rc.label} — Ctrl/Cmd+Shift+Z` : 'Nothing to redo';
}

/* ---------------- events ---------------- */
const ACTIONS = {};
document.addEventListener('click', e => {
  const t = e.target;
  const a = t.closest('[data-open]'); if (a) { e.preventDefault(); const [k, id] = a.dataset.open.split(':'); openRecord(k, id); return; }
  const tb = t.closest('[data-tab]'); if (tb) { e.preventDefault(); go(tb.dataset.tab); return; }
  const s = t.closest('[data-sort]'); if (s) { toggleSort(s.dataset.sort); return; }
  const ms = t.closest('[data-ms]'); if (ms) { e.preventDefault(); if (POP && POP.anchor === ms) closePop(); else openMs(ms); return; }
  const ow = t.closest('[data-own]'); if (ow) { e.preventDefault(); openOwnerMenu(ow); return; }
  const ep = t.closest('[data-eip]'); if (ep) { startEip(ep); return; }
  const dt = t.closest('[data-date]'); if (dt) { e.preventDefault(); if (POP && POP.anchor === dt) closePop(); else openDatePop(dt); return; }
  const h = t.closest('[data-help]'); if (h) { showHelp(h.dataset.help); return; }
  const env = t.closest('[data-copy]'); if (env) { copyText(env.dataset.copy); return; }
  const ac = t.closest('[data-act]'); if (ac && !ac.disabled) { e.preventDefault(); const fn = ACTIONS[ac.dataset.act]; if (fn) fn(ac.dataset.arg, ac, e); else console.warn('no action', ac.dataset.act); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.eip')) { e.preventDefault(); startEip(e.target); }
  if (e.key === 'Escape') { if (POP) closePop(); else if (MODALS.length) closeModal(); }
  const inField = e.target.closest('input,textarea,select,[contenteditable="true"]');
  if ((e.ctrlKey || e.metaKey) && !inField && !MODALS.length && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redoAction() : undoAction(); }
  if ((e.ctrlKey || e.metaKey) && !inField && !MODALS.length && e.key.toLowerCase() === 'y') { e.preventDefault(); redoAction(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'viewas') { VIEW_AS = t.value; storeSet('viewas', VIEW_AS); toast('Now viewing as ' + tName(VIEW_AS)); renderAll(); return; }
  if (t.dataset.inl) { onInline(t); return; }
  if (t.dataset.f) { const [tab, key] = t.dataset.f.split('|'); fset(tab, key, t.type === 'checkbox' ? t.checked : t.value); return; }
  if (t.dataset.chg && ACTIONS[t.dataset.chg]) ACTIONS[t.dataset.chg](t.value, t);
});
let qTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.q) { clearTimeout(qTimer); const tab = t.dataset.q; const v = t.value; qTimer = setTimeout(() => fset(tab, 'q', v), 160); }
});
document.addEventListener('focusin', e => { if (e.target.matches('select.inl')) UI.editing = true; });
document.addEventListener('focusout', e => { if (e.target.matches('select.inl')) setTimeout(flushBlocked, 0); });
window.addEventListener('hashchange', () => { const t = tabOfHash(location.hash); if (t && (t !== R.tab || R.rec)) go(t); });

async function copyText(s){ try { await navigator.clipboard.writeText(s); toast('Copied ' + s); } catch { toast('Copy not available here: ' + s); } }

const FIELD_LABEL = {stage:'stage', priority:'priority', status:'status', relevance:'relevance', importance:'importance', category:'category', due:'due date', nextDue:'due date', ranking:'ranking', strength:'relationship strength', dataRoom:'data room access', type:'type', mandate:'mandate'};
function onInline(el){ applyInline(el.dataset.inl, el.value, el); }
function applyInline(ref, v, el){
  const [coll, id, field] = ref.split('|');
  UI.editing = false;
  if (coll === 'cu') { cuSet(id, field, v); return; }
  const r = rec(coll, id); if (!r) return;
  if (field === 'priority') v = +v;
  if (v === '') v = null;
  if (coll === 'opps' && field === 'status' && v === 'Promoted' && r.kind !== 'idea') { if (el) el.value = r.status; promoteOpp(id); return; }
  const patch = {[field]: v};
  if (coll === 'deals' && field === 'stage') patch.completed = v === 'Completed' ? today() : null;
  setFields(coll, id, patch, `Changed ${FIELD_LABEL[field] || field} on ${recLabel(coll, r)}${v != null ? ' to ' + (field === 'priority' ? v + ' ' + PRIORITY[v] : field.toLowerCase().includes('due') ? fmtDate(v) : v) : ''}`);
}

/* ---------------- boot ---------------- */
async function boot(){
  renderAll();
  const timer = setTimeout(() => { if (!ST.ready) { ST.loadErr = 'The desk’s data can’t be reached yet. It will appear as soon as the connection answers.'; renderAll(); } }, 10000);
  let db = null;
  try { db = await __demoClaude.use('db'); } catch {}
  if (!db) { clearTimeout(timer); ST.loadErr = 'Sign in to claude.ai to use this desk.'; renderAll(); return; }
  ST.db = db;
  try { ST.user = await __demoClaude.use('user'); } catch {}
  if (ST.user) { try { ST.isOwner = !!ST.user.isOwner(); ST.canEdit = !!ST.user.canEdit(); const cw = ST.user.can && ST.user.can('data.write'); if (cw === false) ST.canWrite = false; } catch {} }
  __demoClaude.use('sample').then(s => { ST.sample = s; }).catch(() => {});
  __demoClaude.use('downloads').then(d => { ST.downloads = d; }).catch(() => {});
  db.collection('desk').onSnapshot(snap => {
    ingestShards(snap.docs);
    if (!snap.metadata.fromCache) { clearTimeout(timer); ST.loadErr = null; }
    ST.ready = true; scheduleRender();
  }, err => { clearTimeout(timer); ST.ready = false; ST.loadErr = 'The desk’s data could not be loaded (' + (err && err.code) + ').'; renderAll(); });
  db.collection('changes').orderBy('ts', 'desc').limit(600).onSnapshot(snap => {
    const local = CHANGES.filter(c => !snap.docs.some(d => d.id === c.id) && Date.now() - c.ts < 15000);
    CHANGES.length = 0; CHANGES.push(...local, ...snap.docs.map(d => Object.assign({id: d.id}, clone(d.data()))));
    CHANGES.sort((a, b) => b.ts - a.ts); ST.changesLoaded = true; updateUndoUi();
  }, () => {});
}

/* Load / reset the sample data (owner or editor, on an explicit click) */
async function seedDemo(){
  if (!ST.db) return;
  const box = openModal({title: 'Loading sample data', size: 'narrow', body: `<p><span class="spinner"></span> <span id="seedMsg">Preparing…</span></p>`});
  const msg = t => { const m = $('#seedMsg'); if (m) m.textContent = t; };
  try {
    const {colls, changes} = buildSeed(today());
    msg('Clearing the old change history…');
    const old = await ST.db.collection('changes').get();
    for (const d of old.docs) await ST.db.doc('changes/' + d.id).delete();
    msg('Writing records…');
    const shards = {};
    for (const c of COLLS) for (let k = 0; k < SHARDS[c]; k++) shards[c + '-' + k] = {};
    for (const c of COLLS) for (const [id, r] of Object.entries(colls[c])) shards[shardOf(c, id)][id] = stripId(r);
    let n = 0; const keys = Object.keys(shards);
    for (const k of keys) { await ST.db.doc('desk/' + k).set({r: shards[k]}); ST.shardDocs.add(k); n++; msg(`Writing records… ${n} of ${keys.length}`); }
    msg('Writing change history…');
    for (const c of changes) { const {id, ...body} = c; await ST.db.doc('changes/' + id).set(body); }
    CHANGES.length = 0; changes.forEach(c => CHANGES.push(clone(c)));
    if (!rec('team', VIEW_AS)) { VIEW_AS = 'u-demo'; storeSet('viewas', VIEW_AS); }
    VIEW_AS = 'u-demo'; storeSet('viewas', VIEW_AS);
    closeModal(box); toast('Sample data loaded'); go('summary');
  } catch (e) { console.error(e); closeModal(box); toast('Could not load the sample data (' + (e && (e.code || e.message)) + ').', true); }
}
