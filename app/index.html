/* Write a catch-up attribute: tasks and record fields go to their own records; derived items keep their settings in `catchup`. */
async function cuSet(key, field, v){
  const it = catchupItems().find(i => i.key === key); if (!it) return;
  if (it.taskId) { const t = rec('tasks', it.taskId); return setFields('tasks', t.id, {[field]: v || null}, `Changed ${FIELD_LABEL[field] || field} on ${recLabel('tasks', t)}`); }
  if (field === 'due' && it.dueRef) { const [c, id, f] = it.dueRef; return setFields(c, id, {[f]: v || null}, `Changed due date on ${recLabel(c, rec(c, id))}`); }
  const cur = clone(D.catchup[key] || {}); delete cur.id; cur[field] = v;
  return act(`Changed ${FIELD_LABEL[field] || field} on “${it.title}”`, [{coll:'catchup', id: key, rec: cur}]);
}
async function cuDone(key, undo){
  const it = catchupItems().find(i => i.key === key); if (!it) return;
  if (it.taskId) { const t = rec('tasks', it.taskId); return act(`${undo ? 'Reopened' : 'Completed'} ${recLabel('tasks', t)}`, [{coll:'tasks', id: t.id, rec: Object.assign(clone(t), {done: !undo, doneAt: undo ? null : today(), cleared: false})}]); }
  const cur = clone(D.catchup[key] || {}); delete cur.id;
  Object.assign(cur, undo ? {doneFor: null, doneAt: null} : {doneFor: it.doneMark, doneAt: today()});
  return act(`${undo ? 'Reopened' : 'Completed'} “${it.title}”`, [{coll:'catchup', id: key, rec: cur}]);
}
async function cuSnooze(key, undo){
  const it = catchupItems().find(i => i.key === key); if (!it) return;
  const until = undo ? null : addDays(today(), 7);
  if (it.taskId) { const t = rec('tasks', it.taskId); return act(`${undo ? 'Unsnoozed' : 'Snoozed for 7 days:'} ${recLabel('tasks', t)}`, [{coll:'tasks', id: t.id, rec: Object.assign(clone(t), {snoozeUntil: until})}]); }
  const cur = clone(D.catchup[key] || {}); delete cur.id; cur.snoozeUntil = until;
  return act(`${undo ? 'Unsnoozed' : 'Snoozed for 7 days:'} “${it.title}”`, [{coll:'catchup', id: key, rec: cur}]);
}
async function cuDelete(key){
  const it = catchupItems().find(i => i.key === key); if (!it) return;
  if (it.taskId) return act(`Deleted ${recLabel('tasks', rec('tasks', it.taskId))}`, [{coll:'tasks', id: it.taskId, rec: null}]);
  const cur = clone(D.catchup[key] || {}); delete cur.id; cur.deletedFor = it.doneMark;

}

/* Scan the CRM for people or institutions a team member hasn't spoken to in a while */
const LAPSE = [['1','Over a month',30],['3','Over 3 months',91],['6','Over 6 months',182],['12','Over a year',365]];
function lastSpoken(){
  const m = {};
  const bump = (k, d) => { if (d && (!m[k] || m[k] < d)) m[k] = d; };
  for (const p of all('people')) bump('person:' + p.id, p.lastContact);
  for (const n of all('notes')) { if (n.type === 'Other') continue; for (const l of arr(n.links)) bump(l.kind + ':' + l.id, n.date); }
  for (const p of all('people')) bump((p.orgType === 'company' ? 'company:' : 'firm:') + p.orgId, m['person:' + p.id]);
  return m;
}
ACTIONS.lapsed = () => {
  const w = fget('relationships', 'who', me());
  const st = {who: ['all', 'none'].includes(w) ? me() : w, period: storeGet('lapse:period', '3'), scope: storeGet('lapse:scope', 'people'), never: storeGet('lapse:never', true), sel: new Set(), q: ''};

    foot: `<span class="left" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="viewas" for="lp-date">First reminder on</label><input type="date" id="lp-date" value="${addDays(today(), 3)}" style="padding:4px 6px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface)"><label class="switch" style="font-size:12px"><input type="checkbox" id="lp-spread" checked> Spread over weekdays (3 a day)</label><select id="lp-imp" aria-label="Importance" style="padding:4px 6px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface)">${LEVELS.map(l => `<option ${l === 'Medium' ? 'selected' : ''}>${l}</option>`).join('')}</select></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="lp-go">Create reminders</button>`,
    onMount: el => {
      const draw = () => {
        const t = today(), days = LAPSE.find(x => x[0] === st.period)[2], cutoff = addDays(t, -days);
        const ls = lastSpoken();
        const booked = new Set(all('tasks').filter(x => x.kind === 'reminder' && !x.done && x.link).map(x => x.link.kind + ':' + x.link.id));
        const pool = st.scope === 'people'
          ? all('people').filter(p => arr(p.rms).includes(st.who)).map(p => ({key: 'person:' + p.id, kind: 'person', id: p.id, name: p.name, sub: (p.title ? p.title + ' · ' : '') + orgName(p), strength: p.strength}))
          : [...all('firms').map(f => ({key: 'firm:' + f.id, kind: 'firm', id: f.id, name: f.name, sub: f.type + ' · ' + f.hq, rms: f.rms})), ...all('companies').map(c => ({key: 'company:' + c.id, kind: 'company', id: c.id, name: c.name, sub: 'Company · ' + c.country, rms: c.rms}))].filter(o => arr(o.rms).includes(st.who));
        const ws = words(st.q);
        const rows = pool.map(o => Object.assign(o, {last: ls[o.key] || null, booked: booked.has(o.key)}))
          .filter(o => o.last ? o.last < cutoff : st.never)
          .filter(o => !ws.length || ws.every(x => (o.name + ' ' + o.sub).toLowerCase().includes(x)))
          .sort((a, b) => (a.last || '0').localeCompare(b.last || '0') || a.name.localeCompare(b.name));

          <p class="muted" style="margin:0 0 8px">${rows.length} ${st.scope === 'people' ? 'contact' + (rows.length === 1 ? '' : 's') : 'organisation' + (rows.length === 1 ? '' : 's')} that ${esc(tName(st.who))} looks after and hasn’t spoken to in ${esc(LAPSE.find(x => x[0] === st.period)[1].toLowerCase())}. “Last spoken” uses the latest note or last-contacted date${st.scope === 'people' ? '' : ' across the organisation and its people'}.</p>
          <div class="tw" style="max-height:52vh;overflow:auto">${rows.length ? `<table class="t"><thead><tr><th class="plain" style="width:28px"><input type="checkbox" id="lp-all" aria-label="Select all" ${rows.length && rows.every(r => st.sel.has(r.key)) ? 'checked' : ''}></th><th class="plain">${st.scope === 'people' ? 'Contact' : 'Organisation'}</th>${st.scope === 'people' ? '<th class="plain">Strength</th>' : ''}<th class="plain">Last spoken</th><th class="plain">Reminder</th></tr></thead><tbody>${rows.map(r => `<tr><td><input type="checkbox" class="lp-c" value="${r.key}" ${st.sel.has(r.key) ? 'checked' : ''} aria-label="Select ${esc(r.name)}"></td><td>${link(r.kind, r.id, r.name)}<div class="sub2">${esc(r.sub)}</div></td>${st.scope === 'people' ? `<td>${strengthPill(r.strength)}</td>` : ''}<td>${since(r.last)}</td><td>${r.booked ? '<span class="pill g">Already booked</span>' : ''}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Nobody fits. Everyone in this list has been spoken to recently.</div>'}</div>`;

      });

      $('#lp-go', el).onclick = async () => {
        const picks = el._rows.filter(r => st.sel.has(r.key)); if (!picks.length) return;
        let d = $('#lp-date', el).value || addDays(today(), 3); const spread = $('#lp-spread', el).checked, imp = $('#lp-imp', el).value;

function prepContext(item){

  const orgOfP = p => p && addOrg(p.orgType === 'company' ? 'company' : 'firm', p.orgId);
  if (L.kind === 'person') { const p = rec('people', L.id); if (p) { people = [p.id]; orgOfP(p); focus = p.name + (p.title ? ', ' + p.title : '') + ' at ' + orgName(p); } }
  else if (L.kind === 'firm' || L.kind === 'company') { addOrg(L.kind, L.id); people = peopleAt(L.kind, L.id).map(p => p.id); focus = nameOf(L.kind, L.id); }
  else if (L.kind === 'deal') { const d = rec('deals', L.id); if (d) { deals.push(d.id); addOrg('company', d.clientId); people = uniq([...arr(d.contacts), ...peopleAt('company', d.clientId).map(p => p.id)]); focus = dealName(d) + ' (' + (rec('companies', d.clientId)?.name || '') + ')'; } }
  else if (L.kind === 'dist') { const r = rec('dist', L.id); if (r) { deals.push(r.dealId); addOrg('firm', r.firmId); people = [r.contactId, ...arr(r.extra)].filter(Boolean); focus = (rec('firms', r.firmId)?.name || '') + ' on ' + dealName(rec('deals', r.dealId)); } }
  else if (L.kind === 'opp' || L.kind === 'idea') { const o = rec('opps', L.id); if (o) { if (o.kind === 'idea') { idea = o; arr(o.targets).forEach(c => addOrg('company', c)); arr(o.investors).forEach(f => addOrg('firm', f)); focus = 'Idea: ' + o.title; } else { addOrg('company', o.companyId); addOrg('firm', o.sponsorId); people = peopleAt('company', o.companyId).map(p => p.id); if (o.dealId) deals.push(o.dealId); focus = oppName(o); } } }

  const opps = all('opps').filter(o => orgIds.has(o.companyId) || orgIds.has(o.sponsorId) || (idea && o.id === idea.id));

}

    {key:'details', label:'Transaction details', sort: o => o.details, render: o => o.kind === 'idea' ? `<div class="eip" style="cursor:default" data-hc="${esc(o.thesis || '')}">${esc(o.thesis || '')}</div>` : eip('opps', o.id, 'details') + (o.dealSize || o.estFee ? `<div class="sub2">${o.dealSize ? 'Deal ~' + fmtM(o.dealSize) : ''}${o.dealSize && o.estFee ? ' · ' : ''}${o.estFee ? 'est. fee ~' + fmtM(o.estFee) : ''}</div>` : '')},

    {key:'rel', label:'Relevance', sort: o => IMP_RANK[o.relevance], render: o => selInl(`opps|${o.id}|relevance`, LEVELS, o.relevance)},
    {key:'status', label:'Status', sort: o => o.status, render: o => selInl(`opps|${o.id}|status`, o.kind === 'idea' ? IDEA_STATUS : OPP_STATUS, o.status) + (o.dealId ? `<div>${link('deal', o.dealId, '→ ' + dealName(rec('deals', o.dealId)), 'sub2')}</div>` : '')},
    {key:'rms', label:'Relationship managers', sort: o => arr(o.rms).map(tName).join(), render: o => ownersHtml('opps', o.id, 'rms')},
    {key:'upd', label:'Last update', sort: o => o.lastUpdate, render: o => `<span class="mono">${fmtDate(o.lastUpdate)}</span>`, cls: 'nowrap'},
    {key:'comms', label:'Last comms', sort: o => commsOf(o)?.date || '', render: o => { if (o.kind === 'idea') return '<span class="faint">—</span>'; const c = commsOf(o); if (!c) return '<span class="faint" data-hc="No notes, emails or last-contacted dates recorded for anyone at this company.">Never</span>'; const a = daysBetween(c.date, today()); return `<span class="mono" style="color:${a > 90 ? 'var(--bad)' : a > 30 ? 'var(--warn)' : 'inherit'}" data-hc="${esc(c.how)}">${fmtDate(c.date)}</span><div class="sub2">${a <= 0 ? 'today' : a + 'd ago'}</div>`; }, cls: 'nowrap'},
    {key:'ident', label:'Identified', sort: o => o.identified, render: o => `<span class="mono">${fmtDate(o.identified)}</span>`, cls: 'nowrap'},
  ];
  return viewHead('opportunities', addOppBtn()) + bar + table({id: 'opps', cols, rows: shown, defSort: {key: 'ident', dir: 'desc'}, rowCls: o => isOverdue(o.nextDue) && !['Promoted','Rejected','Parked','Closed'].includes(o.status) ? 'overdue' : '', empty: 'Nothing in the pipeline matches.'});
};

/* Searchable company picker with inline "add new company + contact" */
function companyPicker(el, slot, st, label){
  const draw = () => {
    $(slot, el).innerHTML = msButton(slot.slice(1), {label, form: true, single: true, placeholder: 'Choose a company…', options: () => all('companies').sort((a, b) => a.name.localeCompare(b.name)).map(c => ({v: c.id, l: c.name + ' · ' + c.country})), get: () => st.companyId || '', set: v => { st.companyId = v; st.newCo = null; drawNew(); }, addNew: q => { st.companyId = ''; st.newCo = {name: q || ''}; draw(); drawNew(); }});
  };
  const drawNew = () => {
    const box = $(slot + '-new', el); if (!box) return;
    if (!st.newCo) { box.innerHTML = ''; return; }
    box.innerHTML = `<div class="inlineblock"><div class="form">
      <div class="fld"><label for="nc-name">New company name<span class="req">*</span></label><input id="nc-name" value="${esc(st.newCo.name)}"><div id="nc-dup"></div></div>
      <div class="fld"><label for="nc-country">Country<span class="req">*</span></label><select id="nc-country"><option value="">Choose…</option>${Object.entries(COUNTRIES).map(([g, cs]) => `<optgroup label="${esc(g)}">${cs.map(c => `<option>${esc(c)}</option>`).join('')}</optgroup>`).join('')}</select></div>
      <div class="fld"><label for="nc-sector">Sector<span class="req">*</span></label><select id="nc-sector"><option value="">Choose…</option>${SECTOR_LIST.map(s => `<option>${esc(s)}</option>`).join('')}</select></div>
      <div class="fld"><label for="nc-own">Ownership</label><select id="nc-own"><option value=""></option>${OWNERSHIP.map(s => `<option>${s}</option>`).join('')}</select></div>
      <div class="fld"><label for="nc-cn">Contact name</label><input id="nc-cn"></div>
      <div class="fld"><label for="nc-ct">Contact job title</label><input id="nc-ct"></div>
      <div class="fld full"><label for="nc-ce">Contact email</label><input id="nc-ce" type="email" placeholder="name@example.com"></div>
      <div class="fld full"><button type="button" class="linkbtn" id="nc-cancel">Cancel new company</button></div></div></div>`;
    const nm = $('#nc-name', el); const dup = () => { const d = dupCheck('companies', nm.value); $('#nc-dup', el).innerHTML = d.length ? `<div class="warnbox">Possible duplicate: ${d.map(c => `<button type="button" class="linkbtn" data-usedup="${c.id}">${esc(c.name)}</button>`).join(', ')}. Click one to use it.</div>` : ''; };
    nm.addEventListener('input', () => { st.newCo.name = nm.value; dup(); }); dup();
    box.onclick = e => { const u = e.target.closest('[data-usedup]'); if (u) { st.companyId = u.dataset.usedup; st.newCo = null; draw(); drawNew(); } if (e.target.id === 'nc-cancel') { st.newCo = null; drawNew(); } };
  };
  draw(); drawNew();
}
function dupCheck(coll, name){
  const n = String(name || '').toLowerCase().replace(/\b(ltd|limited|plc|inc|group|holdings|the|&|and|co|company)\b|[^a-z0-9 ]/g, '').trim(); if (n.length < 3) return [];
  return all(coll).filter(r => { const m = r.name.toLowerCase().replace(/[^a-z0-9 ]/g, ''); return m.includes(n) || n.includes(m) || n.split(' ').filter(w => w.length > 3).some(w => m.split(' ').includes(w)); }).slice(0, 4);
}
/* Collect the inline new company (and contact) as writes */
function newCompanyWrites(el, st){
  if (!st.newCo) return {writes: [], companyId: st.companyId};
  const name = $('#nc-name', el).value.trim(), country = $('#nc-country', el).value, sector = $('#nc-sector', el).value;
  if (!name || !country || !sector) throw new Error('Give the new company a name, country and sector.');
  const cid = uid('c'); const writes = [{coll:'companies', id: cid, rec: {name, country, sectors: [sector], verticals: [], ownership: $('#nc-own', el).value || null, size: null, desc: '', rms: [me()], created: today()}}];
  const cn = $('#nc-cn', el).value.trim();
  if (cn) writes.push({coll:'people', id: uid('p'), rec: {name: cn, orgType: 'company', orgId: cid, title: $('#nc-ct', el).value.trim(), category: 'Prospect Client', strength: 'Warm', email: $('#nc-ce', el).value.trim(), phone: '', rms: [me()], lastContact: today(), created: today()}});
  return {writes, companyId: cid};
}

        <div class="fld"><span class="lbl">Possible investors</span><div id="of-inv"></div></div>
        <div class="fld"><label for="of-status">Status</label><select id="of-status">${IDEA_STATUS.map(s => `<option ${s === (st.status || 'New') ? 'selected' : ''}>${s}</option>`).join('')}</select></div>` : `
        <div class="fld full"><span class="lbl">Company<span class="req">*</span></span><div id="of-co"></div><div id="of-co-new"></div></div>
        <div class="fld"><span class="lbl">Investor or sponsor</span><div id="of-sp"></div><span class="help">The company is added to the sponsor’s portfolio.</span></div>
        <div class="fld"><label for="of-signal">Signal<span class="req">*</span></label><select id="of-signal">${SIGNALS.map(s => `<option ${s === (st.signal || 'Network intel') ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
        <div class="fld"><label for="of-mandate">Mandate type<span class="req">*</span></label><select id="of-mandate">${MANDATES.map(s => `<option ${s === (st.mandate || 'Sell-side') ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
        <div class="fld"><label for="of-status">Status</label><select id="of-status">${OPP_STATUS.filter(s => s !== 'Promoted' || st.status === 'Promoted').map(s => `<option ${s === (st.status || 'New') ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
        <div class="fld full"><label for="of-det">Transaction details</label><textarea id="of-det">${esc(st.details || '')}</textarea></div>`}
        <div class="fld"><label for="of-rel">Relevance</label><select id="of-rel">${LEVELS.map(s => `<option ${s === (st.relevance || 'Medium') ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
        <div class="fld"><span class="lbl">Relationship managers</span><div id="of-rm"></div></div>
        <div class="fld"><label for="of-next">Next steps</label><input id="of-next" value="${esc(st.nextStep || '')}"></div>

      </div>`;
      const ms = (slot, cfg) => { const s = $(slot, el); if (s) s.innerHTML = msButton(slot.slice(1), Object.assign({form: true}, cfg)); };
      ms('#of-rm', {label: 'RMs', placeholder: 'Unassigned', options: () => teamOpts(), get: () => st.rms, set: v => st.rms = v});
      if (idea) {
        ms('#of-sec', {label: 'Sectors', options: sectorOpts, get: () => st.sectors, set: v => st.sectors = v});
        ms('#of-geo', {label: 'Geography', options: () => [...geoOpts(), ...countryOpts()], get: () => st.geos, set: v => st.geos = v});
        ms('#of-tg', {label: 'Targets', options: () => all('companies').map(c => ({v: c.id, l: c.name, g: arr(c.sectors)[0]})), get: () => st.targets, set: v => st.targets = v});
        ms('#of-inv', {label: 'Investors', options: () => all('firms').filter(f => INVESTOR_TYPES.includes(f.type)).map(f => ({v: f.id, l: f.name, g: f.type})), get: () => st.investors, set: v => st.investors = v});
      } else {
        companyPicker(el, '#of-co', st, 'Company');
        ms('#of-sp', {label: 'Sponsor', single: true, placeholder: 'None', options: () => all('firms').filter(f => INVESTOR_TYPES.includes(f.type)).map(f => ({v: f.id, l: f.name, g: f.type})), get: () => st.sponsorId || '', set: v => st.sponsorId = v});

      const sw = $('#of-idea', el); if (sw) sw.onchange = () => { collect(); st.kind = sw.checked ? 'idea' : 'company'; draw(); };

      } else {
        let nc; try { nc = newCompanyWrites(el, st); } catch (e) { toast(e.message, true); return; }
        if (!nc.companyId) { toast('Choose a company or add a new one.', true); return; }
        writes.push(...nc.writes);
        const co = rec('companies', nc.companyId) || nc.writes[0]?.rec;
        r = Object.assign(o || {}, {kind: 'company', companyId: nc.companyId, sponsorId: st.sponsorId || null, signal: st.signal, mandate: st.mandate, relevance: st.relevance, status: st.status || 'New', rms: st.rms, details: st.details, nextStep: st.nextStep, nextDue: st.nextDue || null, identified: st.identified || today(), lastUpdate: today(), source: st.source || (o && o.source) || 'Team', sectors: arr(co?.sectors), noteId: st.noteId || (o && o.noteId) || null, ideaId: st.ideaId || (o && o.ideaId) || null, newsId: st.newsId || (o && o.newsId) || null});

      }
      const id = o ? o.id : uid('o');
      writes.push({coll:'opps', id, rec: r});

      opts.after && opts.after(id);
    };
  }});
}

/* Promote an opportunity: open Add deal pre-filled */
const MANDATE_TO_TYPE = {'Sell-side':'Sell-side','Buy-side':'Buy-side','Capital raise':'Capital raise','Debt raise':'Debt raise','Own investment':'Exploratory'};

/* ---------------- Pipeline ---------------- */
function dealView(d, v){ const inactive = d.priority <= 1 || d.stage === 'Completed'; if (v === 'all') return true; if (v === 'inactive') return inactive; if (inactive) return false; if (v === 'active') return STAGES.indexOf(d.stage) >= ACTIVE_FROM; return true; }
const LC_RANGES = [['7','Last 7 days',0,7],['30','8–30 days ago',8,30],['90','31–90 days ago',31,90],['old','Over 90 days',91,1e9]];
VIEWS.pipeline = () => {
  const view = fget('pipeline', 'view', 'pipeline'), dash = fget('pipeline', 'dash', false), q = words(fget('pipeline', 'q', ''));
  let list = all('deals').filter(d => fIn('pipeline', 'type', d.type) && fIn('pipeline', 'sector', d.sectors) && fIn('pipeline', 'prio', String(d.priority)) && fIn('pipeline', 'rm', d.rms));
  const lc = fget('pipeline', 'lc', []);
  if (lc.length) list = list.filter(d => { const a = d.lastComms ? daysBetween(d.lastComms, today()) : 1e9; return LC_RANGES.some(([k, , lo, hi]) => lc.includes(k) && a >= lo && a <= hi); });
  if (q.length) list = list.filter(d => { const h = [dealName(d), rec('companies', d.clientId)?.name, d.target, d.type, d.details, d.nextStep, d.country, arr(d.sectors).join(' '), arr(d.rms).map(tName).join(' ')].join(' ').toLowerCase(); return q.every(w => h.includes(w)); });
  const vc = {pipeline: list.filter(d => dealView(d, 'pipeline')).length, active: list.filter(d => dealView(d, 'active')).length, inactive: list.filter(d => dealView(d, 'inactive')).length, all: list.length};
  const shown = list.filter(d => dealView(d, view));
  const bar = `<div class="fbar"><span class="seg">${[['pipeline','Live'],['active','Active mandates'],['inactive','Inactive'],['all','All']].map(([k, l]) => `<button class="${view === k ? 'on' : ''}" data-act="fv" data-arg="pipeline|view|${k}">${l} <span class="badge">${vc[k]}</span></button>`).join('')}</span>
    ${searchBox('pipeline', 'Search deals…')}${fMs('pipeline', 'type', 'Deal type', optList(DEAL_TYPES))}${fMs('pipeline', 'sector', 'Sector', sectorOpts())}${fMs('pipeline', 'prio', 'Priority', [5, 4, 3, 2, 1, 0].map(p => ({v: String(p), l: p + ' · ' + PRIORITY[p]})))}${fMs('pipeline', 'rm', 'Relationship manager', () => teamOpts())}${fMs('pipeline', 'lc', 'Last comms', LC_RANGES.map(([v, l]) => ({v, l})))}
    <button class="btn ghost sm" data-act="reset" data-arg="pipeline">Reset</button><label class="switch" style="margin-left:auto"><input type="checkbox" data-f="pipeline|dash" ${dash ? 'checked' : ''}> Dashboard</label></div>`;
  const head = viewHead('pipeline', `<button class="btn primary" data-act="addDeal">+ Add deal</button>`);
  if (dash) {
    const months = +fget('pipeline', 'months', 12);
    const size = shown.reduce((s, d) => s + (+d.size || 0), 0);
    return head + bar + `<div class="stats"><div class="stat"><b>${shown.length}</b><span>Deals</span></div><div class="stat"><b>${money(size)}</b><span>Combined deal size</span></div><div class="stat"><b>${shown.filter(d => STAGES.indexOf(d.stage) >= ACTIVE_FROM && d.stage !== 'Completed').length}</b><span>Mandated</span></div><div class="stat"><b>${shown.filter(d => isOverdue(d.nextDue) && dealActive(d)).length}</b><span>Overdue next steps</span></div></div>
      <div class="dash">${barChart('By stage', STAGES.map(s => [s, shown.filter(d => d.stage === s).length]).filter(p => p[1]))}
      ${barChart('By priority', [5, 4, 3, 2, 1, 0].map(p => [p + ' · ' + PRIORITY[p], shown.filter(d => d.priority === p).length, PRIO_COLOR[p]]).filter(p => p[1]))}
      ${barChart('By deal type', pairsFrom(countBy(shown, d => d.type)))}
      ${barChart('By relationship manager', team().map(t => [t.name, shown.filter(d => arr(d.rms).includes(t.id)).length, t.color]).filter(p => p[1]))}
      ${trendChart(`Deals initiated per month (last ${months})`, monthTrend(shown, d => d.initiated, months))}</div>
      <p class="muted" style="margin-top:8px">Trend window: ${[6, 12, 24].map(n => `<button class="linkbtn" data-act="fv" data-arg="pipeline|months|${n}">${n} months</button>`).join(' · ')}</p>`;
  }
  const cols = [
    {key:'name', label:'Client and target', sort: d => dealName(d), render: d => `${link('deal', d.id, dealName(d))}<div class="sub2">${link('company', d.clientId, rec('companies', d.clientId)?.name, 'sub2')}</div><div class="sub2" style="max-width:260px">${esc(d.target || '')}</div>`},
    {key:'type', label:'Deal type', sort: d => d.type, render: d => `${esc(d.type)}<div class="sub2">${esc(d.fee || '')}</div>`},
    {key:'sector', label:'Sector(s)', sort: d => arr(d.sectors).join(), render: d => esc(arr(d.sectors).join(', ')) + `<div class="sub2">${esc(d.country || '')}</div>`},
    {key:'size', label:'Size (US$m)', sort: d => +d.size || 0, render: d => `<span class="mono">${d.size ?? ''}</span>`, cls: 'nowrap'},
    {key:'stage', label:'Stage', sort: d => STAGES.indexOf(d.stage), render: d => `${selInl(`deals|${d.id}|stage`, Object.entries(STAGE_GROUPS).flatMap(([g, ss]) => ss.map(s => ({v: s, l: s}))), d.stage)}<div class="stagebar" title="${STAGES.indexOf(d.stage) + 1} of ${STAGES.length}"><i style="width:${((STAGES.indexOf(d.stage) + 1) / STAGES.length * 100).toFixed(0)}%"></i></div><div class="sub2">${esc(stageGroup(d.stage))}</div>`},
    {key:'prio', label:'Priority', sort: d => -d.priority, render: d => `<span class="prio"><i style="background:${PRIO_COLOR[d.priority]}"></i>${selInl(`deals|${d.id}|priority`, [5, 4, 3, 2, 1, 0].map(p => ({v: p, l: p + ' · ' + PRIORITY[p]})), d.priority)}</span>`},
    {key:'details', label:'Transaction details', sort: d => d.details, render: d => eip('deals', d.id, 'details')},
    {key:'next', label:'Next step', sort: d => d.nextDue || '9999', render: d => `${eip('deals', d.id, 'nextStep')}<div style="margin-top:3px" class="due">${dateInl(`deals|${d.id}|nextDue`, d.nextDue)}</div>`},

function notesByOrg(){

function firmSearchFields(f, ctx){

    ['geographies', [...arr(f.geos), ...arr(f.countries)].join(', ')], ['ticket', arr(f.tickets).join(' ') + ' ' + ticketText(f.tickets)],
    ['stage', arr(f.stages).join(', ')], ['capital', arr(f.capital).join(', ')], ['people', ppl.map(p => p.name + ' ' + (p.title || '')).join(' · ')],
  ];

function matchWhy(fields, q){
  if (!q.length) return {ok: true, why: ''};
  const hits = {};
  for (const w of q) { let any = false; for (const [k, v] of fields) if (String(v || '').toLowerCase().includes(w)) { any = true; (hits[k] = hits[k] || []).push(w); } if (!any) return {ok: false}; }
  const nameHitsAll = q.every(w => String(fields[0][1]).toLowerCase().includes(w));
  if (nameHitsAll) return {ok: true, why: ''};
  const parts = Object.keys(hits).filter(k => k !== 'name').map(k => {
    const v = String(fields.find(f => f[0] === k)[1]); const lw = v.toLowerCase(); const w = hits[k][0]; const i = lw.indexOf(w);
    const snip = k === 'notes' || k === 'description' ? '“…' + v.slice(Math.max(0, i - 25), i + w.length + 30).trim() + '…”' : (k === 'portfolio' || k === 'people') ? v.split(' · ').filter(x => x.toLowerCase().includes(w)).slice(0, 2).join(', ') : '';
    return k + (snip ? ' ' + snip : '');
  });
  return {ok: true, why: 'Matched in ' + parts.join('; ')};
}

function notesTimeline(notes){
  if (!notes.length) return '<div class="empty">No notes yet.</div>';
  return notes.map(n => {

    return `<div class="note"><div class="nh"><span class="mono">${fmtDate(n.date)}</span><span class="pill">${esc(n.type)}</span><b>${esc(tName(n.author))}</b>${ours.length ? `<span>+ ${esc(ours.map(tName).join(', '))}</span>` : ''}<span>with ${who}</span>${n.dealId ? `· ${link('deal', n.dealId, dealName(rec('deals', n.dealId)), 'sub2')}` : ''}${n.private ? '<span class="private">Private</span>' : ''}${n.oppId && rec('opps', n.oppId) ? `<a href="#" class="pill g" data-open="opp:${n.oppId}">In pipeline →</a>` : ''}<span style="flex:1"></span>${n.author === me() ? `<button class="btn sm ghost" data-act="editNote" data-arg="${n.id}">Edit</button><button class="btn sm ghost" data-act="delNote" data-arg="${n.id}" aria-label="Delete note">✕</button>` : ''}</div><div class="nb">${sanitizeHtml(n.html)}</div></div>`;

}
function recordNotes(kind, id){

/* Who a note is with: its organisation and the people there */
function noteParties(links){
  const people = arr(links).filter(l => l.kind === 'person').map(l => l.id).filter(id => rec('people', id));
  let org = arr(links).find(l => l.kind === 'firm' || l.kind === 'company') || null;
  if (!org && people.length) { const p = rec('people', people[0]); org = {kind: p.orgType === 'company' ? 'company' : 'firm', id: p.orgId}; }
  return {people, org};
}
function noteWith(n, cls = 'sub2'){
  const {people, org} = noteParties(n.links);
  const ppl = people.map(id => link('person', id, nameOf('person', id), cls)).join(', ');
  const o = org && nameOf(org.kind, org.id) ? link(org.kind, org.id, nameOf(org.kind, org.id), cls) : '';
  return [ppl, o].filter(Boolean).join(' · ') || '<span class="faint">No one recorded</span>';
}

/* After a note: ask Claude for CRM field updates */
async function suggestCrmUpdates(noteId){
  if (!ST.sample) return;
  const n = rec('notes', noteId); if (!n) return;
  const np = noteParties(n.links); let person = np.people.length === 1 ? rec('people', np.people[0]) : null, org = null, orgKind = null;
  if (np.org) { orgKind = np.org.kind; org = rec(orgKind === 'firm' ? 'firms' : 'companies', np.org.id); }
  if (!org && !person) return;
  const fieldsF = {type: TYPES, sectors: SECTOR_LIST, verticals: Object.values(SECTORS).flat(), geos: GEOS, countries: COUNTRY_LIST, tickets: TICKETS, stages: STAGES_INV, capital: CAPITAL, fundSize: 'number (US$m)', desc: 'text'};
  const fieldsC = {sectors: SECTOR_LIST, verticals: Object.values(SECTORS).flat(), country: COUNTRY_LIST, ownership: OWNERSHIP, size: SIZE_BANDS, desc: 'text'};
  const fieldsP = {title: 'text', category: CATEGORY, strength: STRENGTH, phone: 'text'};
  const pick = (r, keys) => r ? Object.fromEntries(Object.keys(keys).map(k => [k, r[k] ?? null])) : null;
  const prompt = `You help keep a deal desk CRM up to date. Read the meeting note and suggest updates ONLY where the note clearly states new or different information. Never invent.

Note (${n.type}, ${n.date}): """${plain(n.html)}"""

${person ? `Person record: ${JSON.stringify(pick(person, fieldsP))}\nAllowed person fields and values: ${JSON.stringify(fieldsP)}\n` : ''}${org ? `${orgKind === 'firm' ? 'Institution' : 'Company'} record (${org.name}): ${JSON.stringify(pick(org, orgKind === 'firm' ? fieldsF : fieldsC))}\nAllowed ${orgKind} fields and values: ${JSON.stringify(orgKind === 'firm' ? fieldsF : fieldsC)}\n` : ''}
For list fields give the FULL new list (existing values plus additions). Use only the allowed values.
Reply with only a JSON array (possibly empty) of objects: {"target":"person"|"org","field":string,"value":any,"reason":string}`;
  let res;
  const t = toastLoading('✦ Claude is checking the note for CRM updates…');
  try { res = await ST.sample.json(prompt, {modelTier: 'quick'}); }
  catch (e) { t.remove(); if (e && e.code === 'not_granted') return; if (e && e.code !== 'cancelled') toast('Claude could not suggest CRM updates this time.', true); return; }
  t.remove();
  const allowed = {person: fieldsP, org: orgKind === 'firm' ? fieldsF : fieldsC};
  const sugg = arr(res).filter(s => s && allowed[s.target] && allowed[s.target][s.field] !== undefined).map(s => {
    const vocab = allowed[s.target][s.field]; let v = s.value;
    if (Array.isArray(vocab)) { if (Array.isArray(v)) v = v.filter(x => vocab.includes(x)); else if (!vocab.includes(v)) return null; }
    if (vocab === 'number (US$m)') v = +v || null;
    const r = s.target === 'person' ? person : org; if (!r || same(r[s.field], v) || (Array.isArray(v) && !v.length)) return null;
    return Object.assign(s, {value: v, from: r[s.field]});
  }).filter(Boolean);
  if (!sugg.length) { toast('✦ No CRM updates suggested from that note.'); return; }
  openModal({title: '<span class="agent-tag" style="font-size:11px">Agent</span> Suggested CRM updates', body: `<p class="muted" style="margin-top:0">Claude read your note and suggests these changes. Untick anything you don’t want.</p>${sugg.map((s, i) => `<label class="li" style="cursor:pointer"><input type="checkbox" class="sg" value="${i}" checked><div class="grow"><div><b>${esc(s.target === 'person' ? person.name : org.name)}</b> · ${esc(FIELD_NAMES[s.field] || s.field)}</div><div style="font-size:12px"><del style="color:var(--bad)">${fmtVal(s.field, s.from)}</del> → <b>${fmtVal(s.field, s.value)}</b></div><div class="why">${esc(s.reason || '')}</div></div></label>`).join('')}`,
    foot: `<button class="btn" id="sg-skip">Skip</button><button class="btn primary" id="sg-apply">Apply selected</button>`, onMount: el => {
      const off = () => {};
      $('#sg-skip', el).onclick = () => { off(); closeModal(); };
      $('#sg-apply', el).onclick = async () => {
        off(); const chosen = $$('.sg:checked', el).map(c => sugg[+c.value]); closeModal(); if (!chosen.length) return;
        const pp = person ? clone(person) : null, oo = org ? clone(org) : null;
        chosen.forEach(s => { (s.target === 'person' ? pp : oo)[s.field] = s.value; });
        const writes = [];
        if (pp && chosen.some(s => s.target === 'person')) writes.push({coll:'people', id: pp.id, rec: pp});
        if (oo && chosen.some(s => s.target === 'org')) writes.push({coll: orgKind === 'firm' ? 'firms' : 'companies', id: oo.id, rec: oo});
        await act(`Applied ${chosen.length} CRM update${chosen.length === 1 ? '' : 's'} suggested from a note`, writes, {source: 'agent'});
      };
    }});
}
function toastLoading(msg){ const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `<span class="spinner"></span> ${esc(msg)}`; $('#toasts').appendChild(el); return el; }

/* ---------------- Ask Claude (CRM search) ---------------- */
ACTIONS.askClaude = () => {
  if (!ST.sample) { toast('Ask Claude is not available in this view.', true); return; }
  let ctl = null, results = [];
  openModal({title: '<span class="agent-tag" style="font-size:11px">Agent</span> Ask Claude about the CRM', size: 'wide', body: `<div class="fld"><label for="aq">Who are you looking for?</label><textarea id="aq" placeholder="e.g. investors for a US$15m meat-processing plant in southern Africa"></textarea><span class="help">Claude searches only this CRM, never the web.</span></div><div style="margin:10px 0;display:flex;gap:8px"><button class="btn primary" id="aq-run">Search the CRM</button><button class="btn hidden" id="aq-stop">Stop</button></div><div id="aq-out"></div>`,
    foot: `<span class="left" id="aq-sel"></span><button class="btn" data-close>Close</button>`, onClose: () => ctl && ctl.abort(), onMount: el => {
    const out = $('#aq-out', el);
    $('#aq-stop', el).onclick = () => ctl && ctl.abort();
    $('#aq-run', el).onclick = async () => {
      const q = $('#aq', el).value.trim(); if (!q) { toast('Type a question first.', true); return; }
      ctl = new AbortController(); $('#aq-run', el).disabled = true; $('#aq-stop', el).classList.remove('hidden');
      try {
        out.innerHTML = `<p><span class="spinner"></span> Turning your question into search criteria…</p>`;
        const crit = await ST.sample.json(`Turn this request for investors or counterparties into search criteria for a CRM of African investors. Use ONLY these vocabularies.
sectors: ${JSON.stringify(SECTOR_LIST)}
verticals: ${JSON.stringify(Object.values(SECTORS).flat())}
geos: ${JSON.stringify(GEOS)}
countries: ${JSON.stringify(COUNTRY_LIST)}
tickets: ${JSON.stringify(TICKETS)}
stages: ${JSON.stringify(STAGES_INV)}
capital: ${JSON.stringify(CAPITAL)}
types: ${JSON.stringify(TYPES)}
Request: """${q}"""
Reply with only JSON: {"sectors":[],"verticals":[],"geos":[],"countries":[],"tickets":[],"stages":[],"capital":[],"types":[],"size_musd":number|null,"keywords":[],"summary":"one line"}`, {modelTier: 'quick', signal: ctl.signal});
        const c = Object.assign({sectors: [], verticals: [], geos: [], countries: [], tickets: [], stages: [], capital: [], types: [], keywords: []}, crit || {});
        const ctx = {notes: notesByOrg()};
        const scored = all('firms').map(f => {
          let s = 0;
          if (arr(c.types).includes(f.type)) s += 2; else if (arr(c.types).length && !INVESTOR_TYPES.includes(f.type)) s -= 3;
          s += arr(f.sectors).filter(x => arr(c.sectors).includes(x)).length * 2 + (arr(f.sectors).includes('Sector-Agnostic') ? 1 : 0);
          s += arr(f.verticals).filter(x => arr(c.verticals).includes(x)).length * 2;
          s += arr(f.geos).filter(x => arr(c.geos).includes(x)).length + arr(f.countries).filter(x => arr(c.countries).includes(x)).length;
          if (c.size_musd) s += ticketFits(f.tickets, c.size_musd) ? 2 : arr(f.tickets).length ? -1 : 0; else s += arr(f.tickets).filter(x => arr(c.tickets).includes(x)).length;
          s += arr(f.stages).filter(x => arr(c.stages).includes(x)).length * .5 + arr(f.capital).filter(x => arr(c.capital).includes(x)).length;
          const txt = (f.desc + ' ' + (ctx.notes['firm:' + f.id] || []).map(n => plain(n.html)).join(' ')).toLowerCase();
          s += arr(c.keywords).filter(k => txt.includes(String(k).toLowerCase())).length;
          if (f.ranking === 'No') s -= 2;
          return {f, s};
        }).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 80);
        if (!scored.length) { out.innerHTML = `<div class="empty">No institutions in the CRM match those criteria.</div>`; return; }
        out.innerHTML = `<div class="okbox">Criteria: ${esc(c.summary || '')} ${[...arr(c.sectors), ...arr(c.verticals), ...arr(c.geos), ...arr(c.countries), c.size_musd ? 'US$' + c.size_musd + 'm' : '', ...arr(c.types)].filter(Boolean).map(x => `<span class="chip" style="cursor:default">${esc(x)}</span>`).join(' ')}</div><p><span class="spinner"></span> Claude is rating a shortlist of ${scored.length} institutions from the CRM…</p>`;
        const profiles = scored.map(({f}) => ({id: f.id, name: f.name, type: f.type, hq: f.hq, sectors: f.sectors, verticals: f.verticals, geos: f.geos, countries: f.countries, ticket: ticketText(f.tickets) || 'unknown', stages: f.stages, capital: f.capital, fund_musd: f.fundSize, ranking: f.ranking, desc: (f.desc || '').slice(0, 220), portfolio: all('holdings').filter(h => h.firmId === f.id).map(h => rec('companies', h.companyId)?.name).slice(0, 5), recent_notes: (ctx.notes['firm:' + f.id] || []).slice(0, 2).map(n => n.date + ': ' + plain(n.html).slice(0, 160))}));
        const rated = await ST.sample.json(`You are screening institutions in a deal desk CRM for this request: """${q}"""
Rate each institution Strong, Possible or Weak for fit. Base it only on the data given. Be concise.
Institutions: ${JSON.stringify(profiles)}
Reply with only a JSON array, one object per institution you rate Strong or Possible (omit clear misfits, but include at most 12 Weak ones that are borderline):
[{"id":"…","rating":"Strong"|"Possible"|"Weak","reasons":["…"],"evidence":["…"],"unknowns":["…"],"red_flags":["…"]}]`, {signal: ctl.signal});
        const order = {Strong: 0, Possible: 1, Weak: 2};
        results = arr(rated).filter(r => r && rec('firms', r.id)).sort((a, b) => (order[a.rating] ?? 3) - (order[b.rating] ?? 3));
        const li = xs => arr(xs).length ? `<ul>${arr(xs).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
        out.innerHTML = `<div class="okbox" style="margin-bottom:10px">Criteria: ${esc(c.summary || '')}. Shortlisted ${scored.length} from the CRM; ${results.filter(r => r.rating === 'Strong').length} strong and ${results.filter(r => r.rating === 'Possible').length} possible fits.</div>` + (results.map((r, i) => { const f = rec('firms', r.id); return `<div class="ai-res"><input type="checkbox" class="aq-sel" value="${i}" aria-label="Select ${esc(f.name)}"><div><div>${link('firm', f.id, f.name)} <span class="sub2">${esc(f.type)} · ${esc(f.hq)} · ${esc(ticketText(f.tickets) || 'ticket unknown')}</span></div>${li(r.reasons)}${arr(r.evidence).length ? `<div class="lbl">Evidence</div>${li(r.evidence)}` : ''}${arr(r.unknowns).length ? `<div class="lbl">Unknowns</div>${li(r.unknowns)}` : ''}${arr(r.red_flags).length ? `<div class="lbl" style="color:var(--bad)">Red flags</div>${li(r.red_flags)}` : ''}</div><span class="pill ${r.rating === 'Strong' ? 'g' : r.rating === 'Possible' ? 'a' : ''}">${esc(r.rating)}</span></div>`; }).join('') || '<div class="empty">Claude found no good fits in the shortlist.</div>');
        $('#aq-sel', el).innerHTML = results.length ? `<span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">Add ticked to <select id="aq-deal">${all('deals').filter(dealActive).map(d => `<option value="${d.id}">${esc(dealName(d))}</option>`).join('')}</select><button class="btn primary sm" id="aq-add">Add to distribution</button></span>` : '';
        const add = $('#aq-add', el); if (add) add.onclick = () => { const picks = $$('.aq-sel:checked', el).map(x => results[+x.value]); if (!picks.length) { toast('Tick at least one institution.', true); return; } const did = $('#aq-deal', el).value; addToDist(did, picks.map(p => ({firmId: p.id, personId: peopleAt('firm', p.id)[0]?.id || null}))); };
      } catch (e) {
        if (e && e.code === 'cancelled') out.innerHTML = '<div class="empty">Stopped.</div>';
        else if (e && e.code === 'not_granted') out.innerHTML = '<div class="banner">Claude was not allowed for this desk. Allow it when asked to use Ask Claude.</div>';
        else if (e && e.code === 'rate_limited') out.innerHTML = '<div class="banner">Too many requests just now. Try again in a minute.</div>';
        else { console.error(e); out.innerHTML = '<div class="banner">Claude could not answer this time. Try again or rephrase the question.</div>'; }
      } finally { $('#aq-run', el).disabled = false; $('#aq-stop', el).classList.add('hidden'); }
    };
  }});
};

/* Find investors / targets for an idea */
ACTIONS.ideaFind = async (arg, btn) => {
  const [iid, what] = arg.split(':'); const idea = rec('opps', iid);
  if (!ST.sample) { toast('Ask Claude is not available in this view.', true); return; }
  const box = $('#idea-ai'); btn.disabled = true;
  box.innerHTML = card(`<span class="agent-tag">Agent</span> ${what === 'investors' ? 'Suggested investors' : 'Suggested targets'}`, `<p><span class="spinner"></span> Claude is reading the CRM…</p>`);
  const sec = arr(idea.sectors);
  const pool = what === 'investors'
    ? all('firms').filter(f => INVESTOR_TYPES.includes(f.type) && !arr(idea.investors).includes(f.id) && (arr(f.sectors).some(s => sec.includes(s)) || arr(f.sectors).includes('Sector-Agnostic'))).slice(0, 60).map(f => ({id: f.id, name: f.name, type: f.type, hq: f.hq, sectors: f.sectors, geos: f.geos, ticket: ticketText(f.tickets), desc: (f.desc || '').slice(0, 160), portfolio: all('holdings').filter(h => h.firmId === f.id).map(h => rec('companies', h.companyId)?.name)}))
    : all('companies').filter(c => !arr(idea.targets).includes(c.id) && arr(c.sectors).some(s => sec.includes(s))).slice(0, 60).map(c => ({id: c.id, name: c.name, country: c.country, sectors: c.sectors, verticals: c.verticals, ownership: c.ownership, size: c.size, desc: c.desc}));
  try {
    if (!pool.length) throw {code: 'empty'};
    const res = await ST.sample.json(`Investment idea: "${idea.title}". Thesis: ${idea.thesis}. Sectors: ${sec.join(', ')}. Geography: ${arr(idea.geos).join(', ')}.
From this CRM list only, pick up to 8 ${what === 'investors' ? 'investors who could back the idea' : 'companies that could be targets'} and say why in one sentence each.
CRM: ${JSON.stringify(pool)}
Reply with only a JSON array: [{"id":"…","why":"…","fit":"Strong"|"Possible"}]`);
    const list = arr(res).filter(r => r && rec(what === 'investors' ? 'firms' : 'companies', r.id));
    box.innerHTML = card(`<span class="agent-tag">Agent</span> ${what === 'investors' ? 'Suggested investors' : 'Suggested targets'}`, list.map(r => `<div class="li"><div class="grow">${link(what === 'investors' ? 'firm' : 'company', r.id, nameOf(what === 'investors' ? 'firm' : 'company', r.id))}<div class="why">${esc(r.why)}</div></div><span class="pill ${r.fit === 'Strong' ? 'g' : 'a'}">${esc(r.fit || 'Possible')}</span><button class="btn sm" data-act="ideaAdd" data-arg="${iid}:${what}:${r.id}">Add to idea</button></div>`).join('') || '<div class="empty">No good matches in the CRM.</div>', '', list.length);
  } catch (e) {
    box.innerHTML = card(`<span class="agent-tag">Agent</span> Suggestions`, `<div class="empty">${e && e.code === 'empty' ? 'No CRM records share this idea’s sectors.' : e && e.code === 'not_granted' ? 'Claude was not allowed for this desk.' : 'Claude could not answer this time. Try again.'}</div>`);
  } finally { btn.disabled = false; }
};
ACTIONS.ideaAdd = (arg, btn) => { const [iid, what, id] = arg.split(':'); const i = rec('opps', iid); btn.closest('.li')?.remove(); act(`Added ${nameOf(what === 'investors' ? 'firm' : 'company', id)} to idea “${i.title}”`, [{coll:'opps', id: iid, rec: Object.assign(clone(i), {[what]: uniq([...arr(i[what]), id]), lastUpdate: today()})}], {source: 'agent'}); };

VIEWS.conversations = () => {

  const t = today();
  let list = visibleNotes();
  const span = range === 'all' ? null : +range;
  const base = list.length;
  if (span) list = list.filter(n => n.date >= addDays(t, -span));
  list = list.filter(n => fIn('conversations', 'author', n.author) && fIn('conversations', 'type', n.type) && fIn('conversations', 'kind', arr(n.links).map(l => l.kind)));
  if (fget('conversations', 'noopp', false)) list = list.filter(n => !n.oppId || !rec('opps', n.oppId));
  if (q.length) list = list.filter(n => { const h = (plain(n.html) + ' ' + tName(n.author) + ' ' + n.type + ' ' + arr(n.links).map(l => nameOf(l.kind, l.id) + ' ' + (l.kind === 'person' ? orgName(rec('people', l.id)) : '')).join(' ')).toLowerCase(); return q.every(w => h.includes(w)); });
  list.sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));

    <td>${(() => { const np = noteParties(n.links); return (np.people.length ? np.people.map(id => link('person', id, nameOf('person', id))).join(', ') : '') + (np.org ? `<div class="${np.people.length ? 'sub2' : ''}">${link(np.org.kind, np.org.id, nameOf(np.org.kind, np.org.id), np.people.length ? 'sub2' : 'rowlink')}</div>` : ''); })()}${arr(n.attendees).filter(t => t !== n.author).length ? `<div class="sub2">With ${esc(arr(n.attendees).filter(t => t !== n.author).map(tName).join(', '))}</div>` : ''}${n.dealId ? `<div class="sub2">${link('deal', n.dealId, dealName(rec('deals', n.dealId)), 'sub2')}</div>` : ''}</td>
    <td><div class="clamp3" style="max-width:640px" data-hc="${esc(plain(n.html))}">${sanitizeHtml(n.html)}</div></td>
    <td><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${n.oppId && rec('opps', n.oppId) ? `<a href="#" class="pill g" data-open="opp:${n.oppId}">In pipeline →</a>` : `<button class="btn sm" data-act="noteOpp" data-arg="${n.id}">Add to pipeline</button>`}<button class="btn sm" data-act="noteTask" data-arg="${n.id}">Add follow-up</button></div></td></tr>`;
  }).join('');
  const nextRange = {'7': '30', '30': '90', '90': 'all'}[range];
  return viewHead('conversations') + `<div class="fbar"><span class="seg">${[['7','7 days'],['30','30 days'],['90','90 days'],['all','All']].map(([k, l]) => `<button class="${range === k ? 'on' : ''}" data-act="fv" data-arg="conversations|range|${k}">${l}</button>`).join('')}</span>
    ${searchBox('conversations', 'Search notes…')}${fMs('conversations', 'author', 'Author', () => teamOpts())}${fMs('conversations', 'type', 'Note type', optList(NOTE_TYPES))}${fMs('conversations', 'kind', 'Record', Object.entries(kindLabel).map(([v, l]) => ({v, l})))}
    <label class="switch"><input type="checkbox" data-f="conversations|noopp" ${fget('conversations', 'noopp', false) ? 'checked' : ''}> Not yet added to the pipeline</label>
    <button class="btn ghost sm" data-act="reset" data-arg="conversations">Reset</button><span class="fcount">${list.length} of ${base} notes</span></div>
    <div class="tw"><table class="t"><thead><tr><th class="plain">Date</th><th class="plain">Author</th><th class="plain">With</th><th class="plain">Note</th><th class="plain"></th></tr></thead><tbody>${rows || `<tr><td colspan="5"><div class="empty">No notes in this range.</div></td></tr>`}</tbody></table></div>
    ${nextRange ? `<div style="text-align:center;margin-top:12px"><button class="btn" data-act="fv" data-arg="conversations|range|${nextRange}">Show older</button></div>` : ''}`;
};
ACTIONS.noteOpp = id => {
  const n = rec('notes', id); const np = noteParties(n.links); const l = np.org || n.links[0];
  let companyId = '', sponsorId = '';
  if (l.kind === 'company') companyId = l.id;
  if (l.kind === 'firm') sponsorId = INVESTOR_TYPES.includes(rec('firms', l.id)?.type) ? l.id : '';
  if (l.kind === 'person') { const p = rec('people', l.id); if (p?.orgType === 'company') companyId = p.orgId; else if (p && INVESTOR_TYPES.includes(rec('firms', p.orgId)?.type)) sponsorId = p.orgId; }
  oppForm({companyId, sponsorId, signal: 'Network intel', rms: [n.author], details: plain(n.html).slice(0, 400), noteId: id, source: 'Team', identified: n.date});
};
ACTIONS.noteTask = id => { const n = rec('notes', id); const np = noteParties(n.links); const l = np.people.length ? {kind:'person', id: np.people[0]} : np.org || n.links[0]; taskForm({title: 'Follow up: ' + plain(n.html).slice(0, 70), link: l, noteId: id, source: 'CRM', owners: [n.author === me() ? me() : n.author]}); };

/* ---------------- Distribution ---------------- */
const DATE_RANGES = [['7','Last 7 days',0,7],['30','8–30 days',8,30],['old','Over 30 days',31,1e9],['never','Never',-1,-1]];
const inDateRanges = (sel, d) => { if (!sel.length) return true; if (!d) return sel.includes('never'); const a = daysBetween(d, today()); return DATE_RANGES.some(([k, , lo, hi]) => k !== 'never' && sel.includes(k) && a >= lo && a <= hi); };
VIEWS.distribution = () => {
  const withLists = uniq(all('dist').map(r => r.dealId)).map(id => rec('deals', id)).filter(Boolean);
  const others = all('deals').filter(d => dealActive(d) && !withLists.includes(d));
  let dealId = fget('distribution', 'deal', '');
  if (!rec('deals', dealId)) dealId = (withLists[0] || others[0] || {}).id;
  const deal = rec('deals', dealId);
  const picker = `<select class="dealpick" data-f="distribution|deal" aria-label="Deal">${withLists.length ? `<optgroup label="Deals with a list">${withLists.map(d => `<option value="${d.id}" ${d.id === dealId ? 'selected' : ''}>${esc(dealName(d))} · ${esc(rec('companies', d.clientId)?.name || '')} (${all('dist').filter(r => r.dealId === d.id).length})</option>`).join('')}</optgroup>` : ''}${others.length ? `<optgroup label="Other live deals">${others.map(d => `<option value="${d.id}" ${d.id === dealId ? 'selected' : ''}>${esc(dealName(d))} · ${esc(rec('companies', d.clientId)?.name || '')}</option>`).join('')}</optgroup>` : ''}</select>`;
  if (!deal) return viewHead('distribution') + `<div class="empty">No deals yet.</div>`;
  const all_ = all('dist').filter(r => r.dealId === deal.id);
  const q = words(fget('distribution', 'q', '')), stF = fget('distribution', 'st', []);
  let rows = all_.filter(r => fIn('distribution', 'ours', r.ours) && fIn('distribution', 'cap', rec('firms', r.firmId)?.capital) && fIn('distribution', 'dr', r.dataRoom) && inDateRanges(fget('distribution', 'lc', []), r.lastContacted) && inDateRanges(fget('distribution', 'lu', []), r.lastUpdate));
  if (q.length) rows = rows.filter(r => { const f = rec('firms', r.firmId); const ppl = [r.contactId, ...arr(r.extra)].map(id => rec('people', id)?.name).join(' '); const h = [f?.name, f?.type, f?.hq, ppl, r.feedback, r.next, r.status].join(' ').toLowerCase(); return q.every(w => h.includes(w)); });
  const funnelBase = rows;
  if (stF.length) rows = rows.filter(r => stF.includes(r.status));
  const fc = countBy(funnelBase, r => r.status);
  const funnel = `<div class="funnel">${DIST_STATUS.map(s => `<button class="fstep ${stF.length === 1 && stF[0] === s ? 'on' : ''}" data-act="distFunnel" data-arg="${s}"><b>${fc[s] || 0}</b><span>${esc(s)}</span></button>`).join('')}<button class="fstep total ${!stF.length ? 'on' : ''}" data-act="distFunnel" data-arg=""><b>${funnelBase.length}</b><span>Total</span></button></div>`;
  const cols = [
    {key:'inst', label:'Institution and contact', sort: r => rec('firms', r.firmId)?.name, render: r => {
      const f = rec('firms', r.firmId); const p = rec('people', r.contactId); const ex = arr(r.extra).map(id => rec('people', id)).filter(Boolean);
      return `${link('firm', r.firmId, f?.name)}<div class="sub2">${esc(f?.type || '')} · ${esc(f?.hq || '')}</div>
      <div style="margin-top:3px">${p ? `${link('person', p.id, p.name, '')}<button class="envelope" data-copy="${esc(p.email)}" title="Copy ${esc(p.email)}" aria-label="Copy email">✉</button><div class="sub2">${esc(p.title || '')}</div>` : '<span class="faint">No primary contact</span>'}</div>
      <details class="contacts-x" ${DIST_OPEN.has(r.id) ? 'open' : ''} data-row="${r.id}"><summary>Additional contacts (${ex.length})</summary>${ex.map(x => `<div class="cx">${link('person', x.id, x.name, '')}<button class="envelope" data-copy="${esc(x.email)}" aria-label="Copy email">✉</button><button class="linkbtn" data-act="distPrimary" data-arg="${r.id}:${x.id}">Make primary</button><button class="linkbtn" style="color:var(--bad)" data-act="distRmContact" data-arg="${r.id}:${x.id}">Remove</button></div>`).join('')}<div class="cx">${msButton('dx-' + r.id, {label: '+ Add contact', options: () => all('people').filter(pp => pp.orgId === r.firmId && pp.orgType !== 'company' && pp.id !== r.contactId && !arr(r.extra).includes(pp.id)).map(pp => ({v: pp.id, l: pp.name + (pp.title ? ' · ' + pp.title : '')})), addNew: () => personForm({orgType: 'firm', orgId: r.firmId}), get: () => [], set: v => { const pid = arr(v)[0]; if (pid) { closePop(); const rr = rec('dist', r.id); act(`Added ${rec('people', pid).name} to ${recLabel('dist', rr)}`, [{coll:'dist', id: r.id, rec: Object.assign(clone(rr), rr.contactId ? {extra: uniq([...arr(rr.extra), pid])} : {contactId: pid})}]); } }, onChange: () => {}})}</div></details>`; }},
    {key:'status', label:'Status', sort: r => r.status === 'Declined' ? -1 : DIST_STATUS.indexOf(r.status), render: r => selInl(`dist|${r.id}|status`, DIST_STATUS, r.status)},
    {key:'dr', label:'Data room', sort: r => r.dataRoom, render: r => selInl(`dist|${r.id}|dataRoom`, DATAROOM, r.dataRoom)},
    {key:'lc', label:'Last contacted', sort: r => r.lastContacted, render: r => dateInl(`dist|${r.id}|lastContacted`, r.lastContacted), cls: 'nowrap'},
    {key:'fb', label:'Investor feedback', sort: r => r.feedback, render: r => eip('dist', r.id, 'feedback')},
    {key:'next', label:'Next steps', sort: r => r.nextDue || r.next, render: r => `${eip('dist', r.id, 'next')}<div style="margin-top:3px" class="due">${dateInl(`dist|${r.id}|nextDue`, r.nextDue)}</div>`},
    {key:'ours', label:`${BANK_SHORT} contact`, sort: r => arr(r.ours).map(tName).join(), render: r => ownersHtml('dist', r.id, 'ours')},
    {key:'lu', label:'Last update', sort: r => r.lastUpdate, render: r => `<span class="mono">${fmtDate(r.lastUpdate)}</span>`, cls: 'nowrap'},
    {key:'x', label:'', render: r => `<button class="btn sm ghost" data-act="distRm" data-arg="${r.id}" aria-label="Remove from list" title="Remove from list">✕</button>`},
  ];
  return viewHead('distribution', `<button class="btn" data-act="distExport" data-arg="${deal.id}">⤓ Export to Excel</button><button class="btn primary" data-act="distAdd" data-arg="${deal.id}">+ Add to list</button>`) +
    `<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px">${picker}<span class="muted">${esc(deal.type)} · ${money(deal.size)} · ${esc(deal.stage)} · ${link('deal', deal.id, 'Open deal →', '')}</span></div>` + funnel +
    `<div class="fbar">${searchBox('distribution', 'Search institutions, contacts, feedback…')}${fMs('distribution', 'st', 'Status', optList(DIST_STATUS))}${fMs('distribution', 'ours', 'Our contact', () => teamOpts())}${fMs('distribution', 'cap', 'Capital', optList(CAPITAL))}${fMs('distribution', 'lc', 'Last contacted', DATE_RANGES.map(([v, l]) => ({v, l})))}${fMs('distribution', 'lu', 'Last update', DATE_RANGES.slice(0, 3).map(([v, l]) => ({v, l})))}${fMs('distribution', 'dr', 'Data room', optList(DATAROOM))}<button class="btn ghost sm" data-act="reset" data-arg="distribution">Reset</button><span class="fcount">${rows.length} of ${all_.length} institutions</span></div>` +
    table({id: 'dist', cols, rows, defSort: {key: 'status', dir: 'desc'}, empty: all_.length ? 'No rows match the filters.' : 'No one on this list yet. Use Add to list, or add investors from the deal page’s suggestions.'});
};
const DIST_OPEN = new Set();
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-row]')) { if (d.open) DIST_OPEN.add(d.dataset.row); else DIST_OPEN.delete(d.dataset.row); } }, true);
ACTIONS.distFunnel = s => fset('distribution', 'st', s ? [s] : []);
ACTIONS.distPrimary = arg => { const [rid, pid] = arg.split(':'); const r = rec('dist', rid); act(`Made ${rec('people', pid).name} primary contact for ${recLabel('dist', r)}`, [{coll:'dist', id: rid, rec: Object.assign(clone(r), {contactId: pid, extra: uniq([...arr(r.extra).filter(x => x !== pid), r.contactId])})}]); };
ACTIONS.distRmContact = arg => { const [rid, pid] = arg.split(':'); const r = rec('dist', rid); act(`Removed ${rec('people', pid).name} from ${recLabel('dist', r)}`, [{coll:'dist', id: rid, rec: Object.assign(clone(r), {extra: arr(r.extra).filter(x => x !== pid)})}]); };
ACTIONS.distRm = (rid, el) => openPop(el, `<div style="padding:10px">Remove this institution from the list?<div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm danger" id="dr-y">Remove</button><button class="btn sm" id="dr-n">Keep</button></div></div>`, {align: 'right', onMount: p => { $('#dr-y', p).onclick = () => { closePop(); act(`Removed ${recLabel('dist', rec('dist', rid))} from the list`, [{coll:'dist', id: rid, rec: null}]); }; $('#dr-n', p).onclick = closePop; }});

/* Add institutions/people to a deal's list: one row per institution */
async function addToDist(dealId, pairs){
  const deal = rec('deals', dealId); if (!deal) return;
  const rows = all('dist').filter(r => r.dealId === dealId);
  const byFirm = {}; rows.forEach(r => byFirm[r.firmId] = clone(r));
  const created = {}; let added = 0, joined = 0;
  for (const {firmId, personId} of pairs) {
    if (!firmId || !rec('firms', firmId)) continue;
    const r = byFirm[firmId];
    if (r) { if (personId && r.contactId !== personId && !arr(r.extra).includes(personId)) { if (!r.contactId) r.contactId = personId; else r.extra = uniq([...arr(r.extra), personId]); r._chg = true; joined++; } }
    else { const id = uid('r'); byFirm[firmId] = {id, _new: true, dealId, firmId, contactId: personId || null, extra: [], status: 'To contact', dataRoom: 'n/a', lastContacted: null, feedback: '', next: '', nextDue: null, ours: arr(deal.rms).slice(0, 1).length ? [arr(deal.rms)[0]] : [me()], lastUpdate: today(), added: today()}; created[firmId] = true; added++; }
  }
  const writes = Object.values(byFirm).filter(r => r._new || r._chg).map(r => { const id = r.id; delete r._new; delete r._chg; delete r.id; return {coll:'dist', id, rec: r}; });
  if (!writes.length) { toast('Everyone is already on the list.'); return; }
  await act(`Added ${added} institution${added === 1 ? '' : 's'}${joined ? ` and ${joined} extra contact${joined === 1 ? '' : 's'}` : ''} to ${dealName(deal)} distribution`, writes);
}
ACTIONS.distAdd = dealId => {
  const sel = new Set(); let q = '';
  openModal({title: 'Add to distribution list', size: 'wide', body: `<p class="muted" style="margin-top:0">Tick people from the CRM. Someone whose institution is already on the list joins that row as an additional contact.</p><div class="fbar"><label class="search"><span>⌕</span><input id="da-q" type="search" placeholder="Search people, institutions, sectors…"></label><button class="btn sm" id="da-new">+ Add someone new</button><span class="fcount" id="da-n"></span></div><div class="tw" style="max-height:420px;overflow:auto" id="da-list"></div>`,
    foot: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="da-go">Add ticked people</button>`, onMount: el => {
      const onList = new Set(all('dist').filter(r => r.dealId === dealId).flatMap(r => [r.contactId, ...arr(r.extra)]));
      const draw = () => {
        const ws = words(q);
        const ppl = all('people').filter(p => p.orgType !== 'company').filter(p => { if (!ws.length) return true; const f = rec('firms', p.orgId); const h = [p.name, p.title, f?.name, f?.type, arr(f?.sectors).join(' '), arr(f?.geos).join(' ')].join(' ').toLowerCase(); return ws.every(w => h.includes(w)); }).sort((a, b) => orgName(a).localeCompare(orgName(b)));
        $('#da-list', el).innerHTML = `<table class="t"><thead><tr><th class="plain"></th><th class="plain">Person</th><th class="plain">Institution</th><th class="plain">Type</th><th class="plain">Ticket</th></tr></thead><tbody>${ppl.map(p => { const f = rec('firms', p.orgId); const on = onList.has(p.id); return `<tr><td><input type="checkbox" class="da-c" value="${p.id}" ${sel.has(p.id) || on ? 'checked' : ''} ${on ? 'disabled' : ''} aria-label="Select ${esc(p.name)}"></td><td>${esc(p.name)}<div class="sub2">${esc(p.title || '')}${on ? ' · <b>already on list</b>' : ''}</div></td><td>${esc(f?.name || '')}</td><td>${esc(f?.type || '')}</td><td class="mono">${esc(ticketText(f?.tickets))}</td></tr>`; }).join('')}</tbody></table>`;
        $('#da-n', el).textContent = sel.size + ' ticked';
      };
      draw();
      $('#da-q', el).addEventListener('input', e => { q = e.target.value; draw(); });
      $('#da-list', el).addEventListener('change', e => { if (e.target.classList.contains('da-c')) { e.target.checked ? sel.add(e.target.value) : sel.delete(e.target.value); $('#da-n', el).textContent = sel.size + ' ticked'; } });
      $('#da-new', el).onclick = () => { closeModal(); personForm({}); toast('Add the person, then add them to the list.'); };
      $('#da-go', el).onclick = () => { if (!sel.size) { toast('Tick at least one person.', true); return; } closeModal(); addToDist(dealId, [...sel].map(pid => ({firmId: rec('people', pid).orgId, personId: pid}))); };
    }});
};
ACTIONS.distExport = async dealId => {
  if (!ST.downloads) { toast('Downloads are not available in this view.', true); return; }
  const deal = rec('deals', dealId);
  // Same filters as the table
  const html = document.querySelector('#tbl-dist'); const ids = html ? null : null;
  const q = words(fget('distribution', 'q', '')), stF = fget('distribution', 'st', []);
  let rows = all('dist').filter(r => r.dealId === dealId && fIn('distribution', 'ours', r.ours) && fIn('distribution', 'cap', rec('firms', r.firmId)?.capital) && fIn('distribution', 'dr', r.dataRoom) && inDateRanges(fget('distribution', 'lc', []), r.lastContacted) && inDateRanges(fget('distribution', 'lu', []), r.lastUpdate) && (!stF.length || stF.includes(r.status)));
  if (q.length) rows = rows.filter(r => { const f = rec('firms', r.firmId); const ppl = [r.contactId, ...arr(r.extra)].map(id => rec('people', id)?.name).join(' '); const h = [f?.name, f?.type, f?.hq, ppl, r.feedback, r.next, r.status].join(' ').toLowerCase(); return q.every(w => h.includes(w)); });
  rows.sort((a, b) => DIST_STATUS.indexOf(b.status) - DIST_STATUS.indexOf(a.status));
  const data = rows.map(r => { const f = rec('firms', r.firmId) || {}; const p = rec('people', r.contactId) || {}; const ex = arr(r.extra).map(id => rec('people', id)).filter(Boolean); return {'Institution': f.name, 'Type': f.type, 'HQ': f.hq, 'Primary contact': p.name || '', 'Job title': p.title || '', 'Email': p.email || '', 'Additional contacts': ex.map(x => `${x.name} <${x.email}>`).join('; '), 'Status': r.status, 'Data room': r.dataRoom, 'Last contacted': r.lastContacted || '', 'Investor feedback': r.feedback || '', 'Next steps': r.next || '', 'Next step due': r.nextDue || '', [BANK_SHORT + ' contact']: arr(r.ours).map(tName).join(', '), 'Last update': r.lastUpdate || ''}; });
  const t = toastLoading('Preparing the Excel file…');
  try {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const ws = XLSX.utils.json_to_sheet(data); ws['!cols'] = Object.keys(data[0] || {Institution: ''}).map(k => ({wch: Math.min(48, Math.max(12, k.length + 2))}));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Distribution');
    const buf = XLSX.write(wb, {bookType: 'xlsx', type: 'array'});
    t.remove();
    await ST.downloads.save({filename: `${dealName(deal).replace(/[^\w ]+/g, '')} distribution ${today()}.xlsx`, data: new Uint8Array(buf)});
    toast(`Exported ${data.length} institution${data.length === 1 ? '' : 's'}`);
  } catch (e) { t.remove(); if (e && e.code === 'declined') return; console.error(e); toast('Could not export the file' + (e && e.code ? ' (' + e.code + ')' : '') + '.', true); }
};
const loaded = {};
function loadScript(src){ return loaded[src] = loaded[src] || new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { delete loaded[src]; rej(new Error('Could not load ' + src)); }; document.head.appendChild(s); }); }

/* ---------------- News ---------------- */
function newsBucket(d){ const t = today(); const a = daysBetween(d, t); if (a <= 0) return 'Today'; if (a === 1) return 'Yesterday'; const mon = mondayOf(t); if (d >= mon) return 'Earlier this week'; if (d >= addDays(mon, -7)) return 'Last week'; return 'Older'; }
VIEWS.news = () => {
  const view = fget('news', 'view', 'feed'), q = words(fget('news', 'q', ''));
  const t = today();
  const live = all('news').filter(n => n.saved || n.date >= addDays(t, -30));
  let list = view === 'saved' ? live.filter(n => n.saved) : view === 'dismissed' ? live.filter(n => n.dismissed) : live.filter(n => !n.dismissed);
  list = list.filter(n => fIn('news', 'match', [...arr(n.firms), ...arr(n.companies)]) && fIn('news', 'type', n.type) && fIn('news', 'sector', n.sectors) && fIn('news', 'region', n.region) && fIn('news', 'rel', n.relevance) && fIn('news', 'src', n.source));
  if (fget('news', 'matchedOnly', false)) list = list.filter(n => arr(n.firms).length + arr(n.companies).length);
  if (q.length) list = list.filter(n => { const h = [n.title, n.summary, n.why, n.source, ...arr(n.firms).map(f => rec('firms', f)?.name), ...arr(n.companies).map(c => rec('companies', c)?.name)].join(' ').toLowerCase(); return q.every(w => h.includes(w)); });
  list.sort((a, b) => b.date.localeCompare(a.date) || IMP_RANK[a.relevance] - IMP_RANK[b.relevance]);
  const agent = rec('meta', 'agent') || {};
  const feed = live.filter(n => !n.dismissed);
  const matched = uniq(all('news').flatMap(n => [...arr(n.firms), ...arr(n.companies)]));
  const groups = {}; list.forEach(n => (groups[newsBucket(n.date)] = groups[newsBucket(n.date)] || []).push(n));
  const story = n => `<article class="story ${n.dismissed && view !== 'dismissed' ? 'dim' : ''}"><div style="display:flex;flex-direction:column;gap:6px;min-width:0">
      <h4><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a></h4>
      <div class="meta"><b>${esc(n.source)}</b><span class="mono">${fmtDate(n.date)}</span><span class="pill">${esc(n.type)}</span><span>${esc(n.region)}</span>${relPill(n.relevance)}${n.saved ? '<span class="pill b">Saved</span>' : ''}${n.oppId && rec('opps', n.oppId) ? `<a href="#" class="pill g" data-open="opp:${n.oppId}">In pipeline →</a>` : ''}</div>
      <div>${esc(n.summary)}</div>
      ${n.why ? `<div class="whyit"><span class="agent-tag">Agent</span> <b>Why it matters:</b> ${esc(n.why)}</div>` : ''}
      ${arr(n.firms).length + arr(n.companies).length ? `<div class="chips">${arr(n.firms).map(f => `<a href="#" class="chip" data-open="firm:${f}">${esc(rec('firms', f)?.name || '')}</a>`).join('')}${arr(n.companies).map(c => `<a href="#" class="chip" data-open="company:${c}">${esc(rec('companies', c)?.name || '')}</a>`).join('')}</div>` : ''}
      ${arr(n.also).length ? `<div class="meta">Also reported by ${arr(n.also).map(a => `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)}</a>`).join(', ')}</div>` : ''}
    </div><div class="acts"><button class="btn sm" data-act="newsSave" data-arg="${n.id}">${n.saved ? '★ Saved' : '☆ Save'}</button><button class="btn sm" data-act="newsDismiss" data-arg="${n.id}">${n.dismissed ? 'Restore' : 'Dismiss'}</button><button class="btn sm" data-act="newsOpp" data-arg="${n.id}">Add to pipeline</button><button class="btn sm" data-act="newsTask" data-arg="${n.id}">Add follow-up</button></div></article>`;
  const order = ['Today','Yesterday','Earlier this week','Last week','Older'];
  return viewHead('news', `<button class="btn" data-act="newsSources">Monitored sources</button><button class="btn agent" data-act="newsRefresh">↻ Refresh now</button>`) +
    `<div class="statusline"><span class="agent-tag">Agent</span><span>Last run <b>${agent.lastRun ? fmtTs(agent.lastRun) : 'never'}</b> (${agent.lastRun ? ago(agent.lastRun) : ''}) · ${agent.added ?? 0} headlines added · schedule: ${esc(agent.schedule || 'off')} · agent is <b>${agent.on ? 'on' : 'off in the demo'}</b></span>${arr(agent.failed).length ? `<span class="pill a">Could not read: ${esc(arr(agent.failed).join(', '))}</span>` : ''}</div>
    <div class="stats"><div class="stat"><b>${feed.filter(n => n.date >= addDays(t, -7)).length}</b><span>This week</span></div><div class="stat"><b>${feed.filter(n => n.relevance === 'High').length}</b><span>High relevance</span></div><div class="stat"><b>${feed.filter(n => arr(n.firms).length + arr(n.companies).length).length}</b><span>Matched to CRM</span></div><div class="stat"><b>${all('news').filter(n => n.saved).length}</b><span>Saved</span></div><div class="stat"><b>${all('sources').filter(s => s.on).length}</b><span>Sources on</span></div></div>
    <div class="fbar"><span class="seg">${[['feed','Feed'],['saved','Saved'],['dismissed','Dismissed']].map(([k, l]) => `<button class="${view === k ? 'on' : ''}" data-act="fv" data-arg="news|view|${k}">${l}</button>`).join('')}</span>${searchBox('news', 'Search headlines…')}
    <label class="switch"><input type="checkbox" data-f="news|matchedOnly" ${fget('news', 'matchedOnly', false) ? 'checked' : ''}> CRM matches only</label>
    ${fMs('news', 'match', 'CRM match', () => matched.map(id => ({v: id, l: rec('firms', id)?.name || rec('companies', id)?.name || id, g: rec('firms', id) ? 'Institutions' : 'Companies'})).sort((a, b) => a.g.localeCompare(b.g) || a.l.localeCompare(b.l)))}${fMs('news', 'type', 'Type', optList(NEWS_TYPES))}${fMs('news', 'sector', 'Sector', sectorOpts())}${fMs('news', 'region', 'Region', () => optList(uniq(all('news').map(n => n.region))))}${fMs('news', 'rel', 'Relevance', optList(LEVELS))}${fMs('news', 'src', 'Source', () => optList(uniq(all('news').map(n => n.source))))}
    <button class="btn ghost sm" data-act="reset" data-arg="news">Reset</button><span class="fcount">${list.length} stor${list.length === 1 ? 'y' : 'ies'}</span></div>` +
    (list.length ? order.filter(g => groups[g]).map(g => `<div class="grp-h">${g} <span class="badge">${groups[g].length}</span></div>` + groups[g].map(story).join('')).join('') : `<div class="empty">No stories here.</div>`) +
    `<p class="muted" style="font-size:12px;margin-top:14px">Stories drop off after 30 days unless saved.</p>`;
};
